<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FGOガチャ記録</title>
<meta name="description" content="ガチャの結果を記録して、いつでも見返せる召喚のログ帳">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ガチャ記録">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F1A24; --ink2:#5F5868; --ink3:#9A94A3;
  --line:#ECE8EF; --line2:#E0DAE5; --soft:#F8F6FA; --bg:#FFFFFF;
  --ac:#C2356F; --ac2:#9E2C8F; --ac-soft:#FDF0F5; --ac-line:#F4CCDC;
  --danger:#C62D4A;
  --gold:#A36A00; --gold-bg:#FFF6DD; --gold-l:#F0D48A;
  --amber:#A0561C; --amber-bg:#FCF1E6; --amber-l:#EDCCAA;
  --blue:#2C52C4; --blue-bg:#EEF2FF; --blue-l:#C8D6FB;
  --sky:#2F7394; --sky-bg:#EAF5FA; --sky-l:#C4E1EE;
  --purple:#7A38B2; --purple-bg:#F6EEFD; --purple-l:#DFCBF3;
  --grey:#6D6876; --grey-bg:#F3F2F5; --grey-l:#E1DEE6;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --tabh:62px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#fff;-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
body{font-family:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;color:var(--ink);background:#fff;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select,textarea{font-size:16px}
img{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}

/* ---------- app shell ---------- */
.app{min-height:100vh;padding-bottom:calc(var(--tabh) + var(--safe-b) + 20px)}
.app-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:2px solid var(--ac-line);padding-top:var(--safe-t)}
.ah-in{max-width:760px;margin:0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 calc(10px + var(--safe-r)) 0 calc(18px + var(--safe-l))}
.app-head h1{font-size:17.5px;font-weight:800;display:flex;align-items:center;gap:9px;letter-spacing:.02em}
.ah-mark{width:26px;height:18px;border:2.4px solid var(--ac);border-radius:5px;position:relative;flex:none}
.ah-mark::before{content:"";position:absolute;left:62%;top:-2px;bottom:-2px;border-left:2px dashed var(--ac)}
.ah-mark::after{content:"";position:absolute;left:4px;top:3px;width:6px;height:6px;background:var(--ac);clip-path:polygon(50% 0,65% 35%,100% 50%,65% 65%,50% 100%,35% 65%,0 50%,35% 35%)}
.app-main{max-width:760px;margin:0 auto;padding:16px calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l))}
.page{display:flex;flex-direction:column;gap:14px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:0 var(--safe-r) var(--safe-b) var(--safe-l)}
.tab{flex:1;max-width:150px;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:11px;font-weight:700;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ac)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}

.fab{position:fixed;z-index:35;right:calc(18px + var(--safe-r));bottom:calc(var(--tabh) + var(--safe-b) + 16px);display:flex;align-items:center;gap:6px;height:52px;padding:0 20px 0 16px;border-radius:26px;background:linear-gradient(135deg,#E3587B,var(--ac) 45%,var(--ac2));color:#fff;font-weight:800;font-size:15px;box-shadow:0 10px 24px -8px rgba(160,40,110,.6)}
.fab:active{transform:scale(.96)}
@media (min-width:800px){.fab{right:calc(50% - 360px)}}

/* landscape phones: side rail */
@media (orientation:landscape) and (max-height:520px){
  :root{--tabh:0px}
  .app{padding-left:calc(78px + var(--safe-l));padding-bottom:calc(20px + var(--safe-b))}
  .tabbar{top:0;bottom:0;right:auto;width:calc(78px + var(--safe-l));flex-direction:column;justify-content:center;gap:4px;border-top:0;border-right:1px solid var(--line);padding:var(--safe-t) 0 var(--safe-b) var(--safe-l)}
  .tab{flex:none;height:64px;max-width:none}
  .tab.on::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .fab{bottom:calc(16px + var(--safe-b))}
  .app-head{padding-left:0}
}

/* ---------- common ---------- */
.icon-btn{width:42px;height:42px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:active{background:var(--soft)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:14px;font-weight:800;font-size:14.5px;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn.sm{height:36px;font-size:13px;padding:0 13px;border-radius:11px}
.btn.primary{background:var(--ac);color:#fff}
.btn.gold{background:linear-gradient(135deg,#F6C04E,#DC8C12);color:#3A2200}
.btn.ghost{background:var(--soft);border:1px solid var(--line);color:var(--ink2)}
.btn.danger-ghost{color:var(--danger);background:#FFF1F3;border:1px solid #FAD3DA}
.btn.block{width:100%}
.btn.grow{flex:1}
.text-btn{height:40px;padding:0 6px;font-size:15px;color:var(--ink2);font-weight:600}
.text-btn.strong{color:var(--ac);font-weight:800}
.link{color:var(--ac);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.link.light{color:#FFD9E8}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.6}
.muted{color:var(--ink3);font-size:13px}
.sec-h{font-size:14.5px;font-weight:800;margin-top:8px}
.sub-h{font-size:13px;font-weight:800;color:var(--ink2);margin:18px 0 8px}
.sub-h:first-child{margin-top:0}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num.gold{color:var(--gold)}
.unit{font-size:12px;color:var(--ink2);margin-left:2px;font-weight:600}
.input{width:100%;height:46px;border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:0 13px;font-size:16px;transition:border-color .15s}
textarea.input{height:auto;padding:11px 13px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.input.invalid{border-color:var(--danger)}
select.input{appearance:none;-webkit-appearance:none}
.empty{text-align:center;padding:42px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line2);border-radius:var(--r-lg)}
.empty-ic{color:var(--ac);margin-bottom:4px}
.empty-t{font-weight:800;font-size:15px}
.empty-d{font-size:13px;color:var(--ink3);margin-bottom:10px}

/* tone helpers */
.t-gold{--tc:var(--gold);--tb:var(--gold-bg);--tl:var(--gold-l)}
.t-amber{--tc:var(--amber);--tb:var(--amber-bg);--tl:var(--amber-l)}
.t-blue{--tc:var(--blue);--tb:var(--blue-bg);--tl:var(--blue-l)}
.t-sky{--tc:var(--sky);--tb:var(--sky-bg);--tl:var(--sky-l)}
.t-purple{--tc:var(--purple);--tb:var(--purple-bg);--tl:var(--purple-l)}
.t-grey{--tc:var(--grey);--tb:var(--grey-bg);--tl:var(--grey-l)}
.ttag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:800;color:var(--tc);background:var(--tb);border:1px solid var(--tl);white-space:nowrap}

/* chips */
.chips-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips-row::-webkit-scrollbar{display:none}
.chips-row.wrap{flex-wrap:wrap;overflow:visible}
.fchip,.chip-sel{flex:none;height:36px;border-radius:18px;border:1.5px solid var(--line2);background:#fff;padding:0 14px;font-size:13px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;position:relative}
.fchip.on,.chip-sel.on{background:var(--ac-soft);border-color:var(--ac);color:var(--ac)}
.chip-sel{padding:0 8px 0 14px}
.chip-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:13px;font-weight:700;color:inherit;padding-right:2px;height:100%;cursor:pointer}
.chip-sel svg{width:15px;height:15px;pointer-events:none}
.qchip{height:34px;padding:0 13px;border-radius:17px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.qchip.on{background:var(--ac-soft);border-color:var(--ac-line);color:var(--ac)}
.mini-pill{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--grey-bg);color:var(--grey)}
.mini-pill.rose{background:var(--ac-soft);color:var(--ac)}

/* seg */
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink3)}
.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(60,20,50,.12)}
.seg.sm button{height:32px;font-size:12.5px}

/* stepper */
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;height:44px;background:#fff;flex:none}
.stepper button{width:42px;height:100%;font-size:20px;font-weight:700;color:var(--ac);display:grid;place-items:center}
.stepper button:disabled{color:var(--line2)}
.stepper button:active:not(:disabled){background:var(--ac-soft)}
.stepper input{width:48px;height:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:800;font-size:17px;-moz-appearance:textfield;background:transparent}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none}
.stepper input:focus{outline:none;background:var(--ac-soft)}
.stepper.sm{height:40px}
.stepper.sm button{width:36px}
.stepper.sm input{width:40px;font-size:16px}

/* toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;cursor:pointer}
.tr-text{display:flex;flex-direction:column;min-width:0}
.tr-label{font-size:14px;font-weight:700}
.tr-desc{font-size:12px;color:var(--ink3)}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch:checked{background:var(--ac)}
.switch:checked::after{transform:translateX(20px)}

/* toast */
.toast{position:fixed;z-index:200;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 84px);transform:translateX(-50%);background:#2A2230;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:toastIn .3s var(--ease);max-width:calc(100vw - 32px)}
.toast button{color:#FFB3CF;font-weight:800;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- sheet ---------- */
.sheet-back{position:fixed;inset:0;z-index:100;background:rgba(30,15,35,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:sheetUp .3s var(--ease);padding-left:var(--safe-l);padding-right:var(--safe-r)}
.sheet-back.full .sheet{max-height:100%;height:100%;border-radius:0;max-width:640px}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:22px;max-height:86vh}.sheet-back.full .sheet{height:92vh;border-radius:22px}}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet-back.full .sheet-head{padding-top:calc(8px + var(--safe-t))}
@media (min-width:700px){.sheet-back.full .sheet-head{padding-top:8px}}
.sheet-head h2{font-size:15.5px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-side{display:flex;align-items:center}
.sh-side.right{justify-content:flex-end}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 20px;flex:1;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:#fff}
.foot-actions{display:flex;gap:8px}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* ---------- records list ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,#fff,var(--soft))}
.sum-item{padding:12px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.sum-item+.sum-item{border-left:1px solid var(--line)}
.sum-lbl{font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap}
.sum-item .num{font-size:21px}
.filters{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:6px;height:46px;border:1.5px solid var(--line2);border-radius:14px;padding:0 4px 0 12px;background:#fff}
.search:focus-within{border-color:var(--ac)}
.search>svg{color:var(--ink3);width:19px;height:19px;flex:none}
.search input{flex:1;min-width:0;border:0;height:100%;background:transparent}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{display:none}
.hit-count{font-size:12.5px;color:var(--ink2);font-weight:700;display:flex;gap:10px;align-items:center}
.month{display:flex;flex-direction:column;gap:8px}
.month-head{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 0}
.month-head h3{font-size:15px;font-weight:800}
.month-head span{font-size:12px;color:var(--ink3);font-weight:700}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:46px minmax(0,1fr) 18px;gap:12px;align-items:start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 10px 12px 12px;position:relative;overflow:hidden;transition:background .15s}
.rec:active{background:var(--soft)}
.rec::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3.5px;border-radius:0 3px 3px 0;background:var(--line2)}
.rec.tone-gold::before{background:#E4A91F}
.rec.tone-amber::before{background:#D98B45}
.rec.tone-blue::before{background:#5577E0}
.rec.tone-sky::before{background:#5AA3C6}
.rec.tone-purple::before{background:#9C5ED4}
.rec-date{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:11px;padding:6px 0 5px;line-height:1.1}
.rd-d{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.rd-d.sm{font-size:14px}
.rd-w{font-size:11px;color:var(--ink3);font-weight:700;margin-top:2px}
.rd-w.sun{color:#D2465E}.rd-w.sat{color:#3F6BD6}
.rec-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.rec-title{font-weight:800;font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink2)}
.rec-meta b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.rec-res{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.res{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 3px;border-radius:13px;background:var(--tb);border:1px solid var(--tl);font-size:12px;font-weight:700;color:var(--tc);max-width:100%;min-width:0}
.res img,.res i{width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover}
.res i{background:var(--tc);opacity:.85;width:8px;height:8px;margin:0 3px 0 6px}
.res-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.res small{font-size:11px;opacity:.8}
.res.more{background:var(--soft);border-color:var(--line);color:var(--ink3);padding:0 9px}
.rec-none{font-size:12px;color:var(--ink3)}
.rec-chev{width:18px;height:18px;color:var(--line2);align-self:center}

/* detail */
.detail-head{margin-bottom:14px}
.dh-date{font-size:12.5px;color:var(--ink3);font-weight:700}
.dh-title{font-size:19px;font-weight:800;line-height:1.35;word-break:break-word}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kv span{font-size:11px;color:var(--ink3);font-weight:700}
.kv b{font-size:20px;font-variant-numeric:tabular-nums}
.kv small{font-size:11.5px;margin-left:2px;color:var(--ink2)}
.breakdown{font-size:12.5px;color:var(--ink2);margin-top:8px}
.res-detail{display:flex;flex-direction:column;gap:6px}
.res-detail li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px 7px 7px;border-radius:12px;background:var(--tb);border:1px solid var(--tl)}
.res-detail img,.rd-ph{width:34px;height:34px;border-radius:9px;object-fit:cover}
.rd-ph{display:grid;place-items:center;background:#fff;color:var(--tc);font-weight:800}
.rdn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-detail b{font-variant-numeric:tabular-nums;color:var(--tc)}
.memo{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;font-size:14px}

/* ---------- editor ---------- */
.form-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.form-sec:first-child{padding-top:2px}
.form-sec:last-child{border-bottom:0}
.f-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.f-hint{font-size:12px;color:var(--ink3);font-weight:600}
.f-err{color:var(--danger);font-size:12.5px;font-weight:700;margin-top:6px}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.quick-row.servants{margin:0 0 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick-row.servants::-webkit-scrollbar{display:none}
.date-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.date-row .input{min-width:0}
.pull-grid{display:flex;flex-direction:column;gap:8px}
.pull-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr-l{font-weight:800;font-size:15px;display:flex;align-items:baseline;gap:8px}
.pr-l small{font-size:11.5px;color:var(--ink3);font-weight:600}
.total-box{display:flex;margin-top:12px;background:var(--ac-soft);border-radius:14px;padding:10px 4px}
.total-box>div{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;font-size:12px;color:var(--ink2);font-weight:700}
.total-box>div+div{border-left:1px solid var(--ac-line)}
.total-box b{font-size:24px;color:var(--ac);font-variant-numeric:tabular-nums}
.svchip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 3px;border-radius:18px;background:#fff;border:1.5px solid var(--line2);font-size:13px;font-weight:700}
.svchip img,.svchip i{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.svchip i{display:grid;place-items:center;background:var(--soft);font-style:normal;font-size:12px;color:var(--ink3)}
.svchip:active{background:var(--ac-soft)}
.res-rows{display:flex;flex-direction:column;gap:8px}
.res-row{border:1px solid var(--tl);background:var(--tb);border-radius:14px;padding:8px 8px 10px 10px;display:flex;flex-direction:column;gap:7px;animation:rowIn .25s var(--ease)}
@keyframes rowIn{from{opacity:0;transform:translateY(-4px)}}
.rr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.type-sel{appearance:none;-webkit-appearance:none;border:0;background:#fff;border:1px solid var(--tl);color:var(--tc);font-weight:800;font-size:13px;height:30px;border-radius:9px;padding:0 26px 0 10px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.rr-bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.rr-bottom .input{height:40px;min-width:0}
.add-types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.add-type{height:38px;border-radius:11px;border:1.5px dashed var(--tl);color:var(--tc);background:#fff;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.add-type:active{background:var(--tb)}

/* ---------- stats ---------- */
.hero-stat{padding:18px 16px}
.hs-main{display:flex;flex-direction:column}
.hs-lbl{font-size:12.5px;font-weight:700;color:var(--ink3)}
.num.xl{font-size:38px;line-height:1.15;color:var(--ac)}
.hs-sub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hs-sub>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink2);font-weight:600}
.hs-sub b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.rate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rate{border-radius:14px;background:var(--tb);border:1px solid var(--tl);padding:12px;display:flex;flex-direction:column;color:var(--tc)}
.rl{font-size:12px;font-weight:800}
.rate b{font-size:24px;line-height:1.25;font-variant-numeric:tabular-nums}
.rate small{font-size:12px;margin-left:2px}
.rp{font-size:12px;font-weight:700;opacity:.8}
.month-chart{padding:14px 12px 12px}
.mc-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:160px;align-items:end}
.mc-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.mc-v{font-size:9.5px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums}
.mc-bar{width:100%;max-width:26px;min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#E8709A,var(--ac));position:relative;display:flex;justify-content:center}
.mc-m{font-size:11px;color:var(--ink2);font-weight:700}
.mc-five{position:absolute;top:-2px;transform:translateY(-100%);width:17px;height:17px;border-radius:50%;background:#F2B53B;color:#3a2400;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center}
.mc-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-top:10px}
.mc-five.dot{position:static;transform:none;width:10px;height:10px}
.rank{padding:4px 14px}
.rank-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0}
.rank-row+.rank-row{border-top:1px solid var(--line)}
.rk{font-weight:800;color:var(--ac);text-align:center}
.rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.rv em{font-style:normal;font-size:11px;color:var(--gold);background:var(--gold-bg);padding:1px 6px;border-radius:6px}

/* ---------- gallery ---------- */
.info-card{font-size:13px;line-height:1.7;color:var(--ink2);background:var(--ac-soft);border:1px solid var(--ac-line);border-radius:var(--r-md);padding:12px 14px}
.info-card b{color:var(--ac)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gal-add{aspect-ratio:.68;border:2px dashed var(--ac-line);border-radius:14px;color:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:800;background:var(--ac-soft)}
.gcard{aspect-ratio:.68;border-radius:14px;padding:4px;background:var(--frame);position:relative;display:block;width:100%;text-align:left}
.fr-gold{--frame:linear-gradient(145deg,#FFF1BF,#E1A52A 28%,#FFE89A 52%,#B97B12 78%,#F7D57A)}
.fr-silver{--frame:linear-gradient(145deg,#F6F8FB,#AFB7C4 30%,#EEF1F6 55%,#8A93A2 80%,#D9DEE7)}
.fr-bronze{--frame:linear-gradient(145deg,#F2D1B0,#A8683A 35%,#E6BD92 60%,#7A4724)}
.gc-in{width:100%;height:100%;border-radius:10px;overflow:hidden;position:relative;background:#1A1440}
.art{width:100%;height:100%;object-fit:cover}
.art.ph{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,hsl(var(--h) 60% 55%),hsl(var(--h) 55% 22%) 70%,hsl(var(--h) 60% 12%))}
.art.ph span{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;color:rgba(255,255,255,.88);font-size:clamp(20px,40%,120px);font-size:42px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.gc-cls{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:rgba(15,10,40,.75);border:1.5px solid #E9C466;color:#FFE7A6;font-size:11px;font-weight:900;display:grid;place-items:center}
.gc-pu{position:absolute;top:5px;right:5px;background:var(--ac);color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px}
.gc-foot{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 5px;background:linear-gradient(transparent,rgba(10,6,30,.85));color:#fff;display:flex;flex-direction:column}
.gc-stars{color:#FFD35C;font-size:10px;letter-spacing:-1px;line-height:1}
.gc-name{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-detail{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center;margin-bottom:10px}
.gcard.big{width:130px}
.svd-stars{color:#E0A316;font-size:15px;letter-spacing:1px}
.svd-cls{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);margin-top:4px}
.svd-cls i{width:24px;height:24px;border-radius:50%;background:#1A1440;color:#FFE7A6;font-style:normal;font-size:12px;font-weight:900;display:grid;place-items:center;border:1.5px solid #E9C466}
.svd-name{font-size:20px;font-weight:800;line-height:1.3;margin-top:4px;word-break:break-word}
.svd-line{font-size:13px;color:var(--ink2);margin-top:8px}
.img-pick{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.gcard.pick{width:120px;cursor:pointer}
.pick-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#D9D2F5;font-size:12px;font-weight:700}
.pick-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.cls-btn{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px 0 4px;border-radius:11px;border:1.5px solid var(--line2);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden}
.cls-btn i{width:28px;height:28px;border-radius:8px;background:var(--soft);font-style:normal;font-weight:900;display:grid;place-items:center;flex:none}
.cls-btn.on{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
.cls-btn.on i{background:#1A1440;color:#FFE7A6}

/* settings menu */
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left}
.menu button+button{border-top:1px solid var(--line)}
.menu button:active{background:var(--soft)}
.menu svg{color:var(--ac);flex:none}
.menu span{display:flex;flex-direction:column}
.menu b{font-size:14.5px}
.menu small{font-size:12px;color:var(--ink3)}
.menu .danger svg,.menu .danger b{color:var(--danger)}
.ver{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:18px}

/* ---------- summon lobby ---------- */
.banner-card{position:relative;overflow:hidden;border-radius:var(--r-lg);background:radial-gradient(120% 120% at 70% 20%,#3A2E86,#191336 60%,#0D0A20);color:#fff;min-height:170px;padding:18px}
.bc-circle{position:absolute;right:-60px;top:-30px;width:260px;height:260px;color:#8FD2FF;opacity:.28}
.bc-circle .mc-l1{animation:mcspin 40s linear infinite}
.bc-circle .mc-l2{animation:mcspin 60s linear infinite reverse}
.bc-body{position:relative}
.bc-title{font-size:19px;font-weight:900;letter-spacing:.06em;text-shadow:0 0 16px rgba(143,210,255,.6)}
.bc-pu{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.bc-sv{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bc-sv .art{width:64px;height:88px;border-radius:10px;border:2px solid #E9C466}
.bc-sv.r5 .art{box-shadow:0 0 14px rgba(255,205,80,.55)}
.bc-sv span{font-size:9.5px;color:#FFD35C;letter-spacing:-1px}
.bc-empty{margin-top:12px;font-size:13px;line-height:1.7;color:#D8D2F4;max-width:28em}
.stone-card{padding:12px 16px 4px}
.sc-row{display:flex;align-items:center;gap:10px}
.sc-l{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;flex:none}
.quartz{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
.sc-in{width:120px;text-align:right;font-weight:800;font-size:18px}
.sc-u{font-size:13px;color:var(--ink2)}
.sc-quick{display:flex;gap:6px;margin-top:10px}
.pull-btns{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.summon-btn{height:64px;flex-direction:column;gap:1px;border-radius:16px;font-size:16px}
.summon-btn small{display:flex;align-items:center;gap:3px;font-size:12px;opacity:.85}
.summon-btn.single{background:linear-gradient(180deg,#4A5FB8,#2B3A85);color:#fff;box-shadow:0 8px 18px -10px rgba(40,60,160,.8)}
.summon-btn.multi{background:linear-gradient(180deg,#F7C95A,#D98A13);color:#3A2200;box-shadow:0 10px 22px -10px rgba(200,120,10,.9)}
.set-card{padding:4px 16px}
.set-card .toggle-row+.toggle-row{border-top:1px solid var(--line)}
.sim-tot{padding:6px 14px}
.st-row{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;padding:8px 0;font-size:13.5px;font-weight:700}
.st-row+.st-row{border-top:1px solid var(--line)}
.st-row>span:first-child{color:var(--tc,var(--ink2))}
.st-row b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--tc,var(--ink))}
.st-row>span:last-child{text-align:right;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.st-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);padding:10px 0 8px;border-top:1px solid var(--line)}
.rates{padding:4px 14px}
.rates summary{padding:10px 0;font-weight:800;font-size:14px;cursor:pointer}
.rates table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.rates td{padding:6px 0;border-top:1px solid var(--line)}
.rates td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rates .note{padding-bottom:10px}

/* ================================================================
   召喚演出（全画面・16:9のステージ）
   ================================================================ */
.summon{position:fixed;inset:0;z-index:300;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sv-viewport{position:absolute;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;container-type:size}
.summon.rot .sv-viewport{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
.stage{position:relative;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;overflow:hidden;container-type:size;cursor:pointer;color:#fff;font-family:'Noto Sans JP',sans-serif;
  --rc:#8FD8FF;--mc:#8FD2FF}
.stage.ring-gold{--rc:#FFD24D}
.stage.ring-rainbow{--rc:#FFFFFF}
.st-bg{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 62%,#1C2B6B 0%,#0C1236 45%,#03040E 100%)}
.st-bg::after{content:"";position:absolute;inset:0;opacity:.6;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 76% 18%,#fff,transparent),radial-gradient(1px 1px at 88% 60%,#fff,transparent),radial-gradient(1px 1px at 55% 12%,#fff,transparent),radial-gradient(1px 1px at 6% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 88%,#fff,transparent)}
.st-floor{position:absolute;left:0;right:0;bottom:0;height:45%;background:radial-gradient(60% 70% at 50% 40%,rgba(80,140,255,.22),transparent 70%)}
.ph-rings.ring-gold .st-floor{background:radial-gradient(60% 70% at 50% 40%,rgba(255,200,70,.35),transparent 70%)}
.ph-rings.ring-rainbow .st-floor{background:radial-gradient(60% 70% at 50% 40%,rgba(255,120,220,.4),transparent 70%);animation:hue 1.1s linear infinite}

/* 魔法陣 */
.st-circle{position:absolute;left:50%;top:64%;width:92cqh;aspect-ratio:1;translate:-50% -50%;transform:perspective(90cqh) rotateX(64deg);color:var(--mc);transition:opacity .6s,filter .6s;filter:drop-shadow(0 0 1.2cqh var(--mc))}
.st-circle.dim{opacity:.22;filter:none}
.ph-rings .st-circle{--mc:var(--rc);filter:drop-shadow(0 0 2cqh var(--rc)) brightness(1.25)}
.ph-rings.ring-rainbow .st-circle{--mc:#ff7ad9;animation:hue .9s linear infinite}
.mc{width:100%;height:100%;overflow:visible}
.mc circle,.mc line,.mc polyline,.mc polygon,.mc ellipse{fill:none;stroke:currentColor;stroke-width:1.1;vector-effect:non-scaling-stroke}
.mc-l1,.mc-l2,.mc-l3,.mc-l4{transform-box:fill-box;transform-origin:center}
.stage .mc-l1{animation:mcspin 22s linear infinite}
.stage .mc-l2{animation:mcspin 30s linear infinite reverse}
.stage .mc-l3{animation:mcspin 16s linear infinite}
.stage .mc-l4{animation:mcspin 9s linear infinite reverse}
.ph-circle .mc-l1{animation-duration:7s}.ph-circle .mc-l2{animation-duration:9s}.ph-circle .mc-l3{animation-duration:5s}
.ph-rings .mc-l1{animation-duration:2.4s}.ph-rings .mc-l2{animation-duration:3s}.ph-rings .mc-l3{animation-duration:1.6s}.ph-rings .mc-l4{animation-duration:1s}
@keyframes mcspin{to{rotate:360deg}}
@keyframes hue{to{filter:hue-rotate(360deg)}}

/* 集まる光 */
.particles{position:absolute;left:50%;top:52%;width:0;height:0}
.particles i{position:absolute;width:calc(1.1cqh * var(--s));height:calc(1.1cqh * var(--s));border-radius:50%;background:#fff;box-shadow:0 0 1.4cqh 0.4cqh var(--mc);opacity:0;animation:gather 1s ease-in infinite}
@keyframes gather{0%{opacity:0;transform:rotate(var(--a)) translateY(var(--d))}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(0)}}

/* 中央の光 */
.st-orb{position:absolute;left:50%;top:52%;width:16cqh;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,var(--rc) 38%,transparent 70%);animation:orbPulse .9s ease-in-out infinite;mix-blend-mode:screen}
.ph-rings .st-orb{animation:orbGrow var(--tr) cubic-bezier(.5,0,.9,.4) forwards}
.ph-rings.ring-rainbow .st-orb{animation:orbGrow var(--tr) cubic-bezier(.5,0,.9,.4) forwards,hue .8s linear infinite;background:radial-gradient(circle,#fff 0 18%,#ff7ad9 32%,#7ad7ff 46%,transparent 70%)}
@keyframes orbPulse{0%,100%{scale:.55;opacity:.7}50%{scale:.8;opacity:1}}
@keyframes orbGrow{0%{scale:.6}100%{scale:3.4}}

/* 光の環 */
.rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding-top:4cqh}
.ring-g{grid-area:1/1;width:74cqh;aspect-ratio:1;transform:rotate(var(--t)) scaleY(.3);opacity:0;animation:ringIn .45s var(--dl) ease-out forwards;filter:drop-shadow(0 0 1.3cqh var(--rc))}
.ring-g::before{content:"";position:absolute;inset:0;border-radius:50%;border:.5cqh solid var(--rc);opacity:.35}
.ring{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40%,var(--rc) 78%,#fff 90%,transparent 94%);-webkit-mask:radial-gradient(closest-side,transparent 86%,#000 89%,#000 98%,transparent 100%);mask:radial-gradient(closest-side,transparent 86%,#000 89%,#000 98%,transparent 100%);animation:mcspin var(--sp) linear infinite}
.ring-rainbow .ring{background:conic-gradient(from 0deg,#ff4d6d,#ffb84d,#fff34d,#6dff7a,#4dd8ff,#8a6dff,#ff4dd8,#ff4d6d)}
.ring-rainbow .ring-g{filter:drop-shadow(0 0 1.6cqh #fff);animation:ringIn .45s var(--dl) ease-out forwards,hue 1s linear infinite}
.ring-rainbow .ring-g::before{border-color:#fff;opacity:.5}
@keyframes ringIn{0%{opacity:0;scale:.25}70%{opacity:1;scale:1.06}100%{opacity:1;scale:1}}
.ph-rings.ring-gold .ring-g{animation:ringIn .45s var(--dl) ease-out forwards,ringPulse .5s calc(var(--dl) + .45s) ease-in-out infinite}
@keyframes ringPulse{50%{scale:1.05}}
.st-rainbow{position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 52%,rgba(255,80,120,.0),rgba(255,80,120,.28),rgba(255,220,80,.28),rgba(80,255,140,.28),rgba(80,200,255,.28),rgba(160,90,255,.28),rgba(255,80,200,.28),rgba(255,80,120,0));mix-blend-mode:screen;animation:mcspin 3s linear infinite,rbIn var(--tr) ease-in forwards;scale:2}
@keyframes rbIn{0%{opacity:0}100%{opacity:1}}
.ph-rings.ring-rainbow{animation:shake .12s linear infinite}
.ph-rings.ring-gold .rings{animation:shakeS .16s linear infinite}
@keyframes shake{0%{translate:0 0}25%{translate:.25cqw -.2cqh}50%{translate:-.25cqw .2cqh}75%{translate:.2cqw .25cqh}100%{translate:0 0}}
@keyframes shakeS{50%{translate:.12cqw .1cqh}}

/* 閃光 */
.st-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flashA .45s ease-out forwards;pointer-events:none;z-index:6}
.st-flash.gold{background:radial-gradient(circle at 50% 50%,#fff 20%,#FFE39A 70%)}
.st-flash.rainbow{background:radial-gradient(circle at 50% 50%,#fff 22%,#ffd1f0 45%,#bfe9ff 70%);animation:flashA .6s ease-out forwards}
@keyframes flashA{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* カード */
.st-card-wrap{position:absolute;left:50%;top:51%;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;z-index:4;transition:opacity .4s,scale .4s}
.st-card-wrap.away{opacity:0;scale:.9}
.st-card-slot{position:relative;perspective:140cqh}
.card3d{width:32cqh;height:50cqh;position:relative}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.3,.85,.3,1)}
.card3d.spin .card-inner{animation:cardSpin 1.05s cubic-bezier(.1,.7,.2,1) both}
@keyframes cardSpin{0%{transform:translateY(24cqh) scale(.08) rotateY(-1980deg);opacity:0}12%{opacity:1}100%{transform:translateY(0) scale(1) rotateY(0deg);opacity:1}}
.card-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:2.2cqh;padding:1.1cqh;background:var(--frame);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2cqh 5cqh rgba(0,0,0,.55)}
.face.front{transform:rotateY(180deg)}
.card3d.fr-gold .face{box-shadow:0 0 5cqh .6cqh rgba(255,196,60,.55),0 2cqh 5cqh rgba(0,0,0,.5)}
.card3d.promoted{animation:promo .48s ease-out}
@keyframes promo{0%{scale:1}35%{scale:1.1}100%{scale:1}}
.card3d.jolt{animation:jolt .08s linear infinite}
@keyframes jolt{0%{translate:0 0}25%{translate:.5cqh -.3cqh}50%{translate:-.4cqh .4cqh}75%{translate:.3cqh .3cqh}}
.face-in{width:100%;height:100%;border-radius:1.4cqh;overflow:hidden;position:relative}
.cback{background:radial-gradient(circle at 50% 42%,#2D4598,#101A4A 55%,#070B24);display:grid;place-items:center}
.cb-pattern{position:absolute;inset:0;opacity:.35;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.18) 0 4deg,transparent 4deg 15deg),radial-gradient(circle at 50% 42%,transparent 38%,rgba(255,255,255,.2) 39%,transparent 40%,transparent 52%,rgba(255,255,255,.15) 53%,transparent 54%)}
.cb-emblem{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.2cqh}
.cb-k{width:17cqh;height:17cqh;border-radius:50%;display:grid;place-items:center;font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;font-size:9.5cqh;color:#FFE7A6;background:radial-gradient(circle,#2A2468,#0E0B30);border:.6cqh solid #E1B54A;box-shadow:0 0 2.5cqh rgba(255,210,100,.5),inset 0 0 2cqh rgba(0,0,0,.6)}
.cb-n{font-size:2.3cqh;font-weight:800;letter-spacing:.2em;color:#F6E2A8}
.cb-emblem.ce .cb-k{color:#FFD1E6;border-color:#E27FAF;box-shadow:0 0 2.5cqh rgba(255,120,190,.45),inset 0 0 2cqh rgba(0,0,0,.6)}
.cfront{background:#140F35}
.cfront .art{position:absolute;inset:0}
.cfront .art.ph span{font-size:18cqh}
.cf-cls{position:absolute;top:1cqh;left:1cqh;width:6cqh;height:6cqh;border-radius:50%;display:grid;place-items:center;background:rgba(14,11,48,.8);border:.35cqh solid #E1B54A;color:#FFE7A6;font-weight:900;font-size:3.2cqh}
.cf-plate{position:absolute;left:0;right:0;bottom:0;height:10cqh;background:linear-gradient(transparent,rgba(8,6,28,.9) 55%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:1.2cqh}
.cf-stars{color:#FFD35C;font-size:3.2cqh;letter-spacing:-.2cqh;text-shadow:0 0 1cqh rgba(255,200,80,.8)}
.fr-silver .cf-stars{color:#E6EBF2;text-shadow:none}
.ce-art{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1.4cqh,transparent 1.4cqh 2.8cqh),radial-gradient(circle at 50% 40%,#7A3A7E,#2B1238 70%)}
.ce-art.r4,.cfront.ce.r4 .ce-art{background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 1.4cqh,transparent 1.4cqh 2.8cqh),radial-gradient(circle at 50% 40%,#3E6FB0,#132447 70%)}
.ce-art.r3,.cfront.ce.r3 .ce-art{background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1.4cqh,transparent 1.4cqh 2.8cqh),radial-gradient(circle at 50% 40%,#4B6A58,#1A2A22 70%)}
.ce-art span{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;font-size:6cqh;color:rgba(255,255,255,.75);letter-spacing:.3em;writing-mode:vertical-rl}

/* バチバチ */
.bolts{position:absolute;left:50%;top:50%;width:62cqh;height:87cqh;translate:-50% -50%;pointer-events:none;overflow:visible;z-index:3}
.bolts polyline{fill:none;stroke:#FFF6C8;stroke-width:1.3;stroke-linejoin:bevel;filter:drop-shadow(0 0 1.2px #FFD24D) drop-shadow(0 0 3px #FFB800)}
.bolts g{opacity:0}
.bolts .bg0{animation:bz .21s steps(1) infinite}
.bolts .bg1{animation:bz .21s steps(1) .07s infinite}
.bolts .bg2{animation:bz .21s steps(1) .14s infinite}
@keyframes bz{0%{opacity:1}33%{opacity:0}}

/* ★ */
.st-stars{display:flex;gap:.6cqh;margin-top:2cqh;font-size:5cqh;line-height:1;height:5cqh}
.st-stars span{opacity:0;animation:starPop .32s cubic-bezier(.2,1.6,.4,1) forwards}
.st-stars.gold span{color:#FFD35C;text-shadow:0 0 1.5cqh rgba(255,200,60,.9)}
.st-stars.silver span{color:#E8EDF4;text-shadow:0 0 1cqh rgba(200,220,255,.6)}
@keyframes starPop{0%{opacity:0;scale:2.2}100%{opacity:1;scale:1}}
.st-name{margin-top:1.6cqh;font-size:3.2cqh;font-weight:800;text-shadow:0 0 1.4cqh rgba(0,0,0,.8);opacity:0;animation:fadeUp .4s .5s forwards;max-width:70cqw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fadeUp{from{opacity:0;translate:0 1cqh}to{opacity:1;translate:0 0}}

/* 登場シーン */
.intro{position:absolute;inset:0;z-index:8;background:radial-gradient(80% 110% at 72% 50%,#2E2366,#0B0A24 60%,#030310);animation:fade .45s}
.intro.r5{background:radial-gradient(80% 110% at 72% 50%,#5A3A1A,#1C1030 60%,#05030F)}
.intro-rays{position:absolute;left:72%;top:50%;width:200cqw;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 5deg,transparent 5deg 15deg);animation:mcspin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 10%,transparent 45%);mask:radial-gradient(circle,#000 10%,transparent 45%)}
.intro.r5 .intro-rays{background:repeating-conic-gradient(from 0deg,rgba(255,210,110,.14) 0 5deg,transparent 5deg 15deg)}
.intro-art{position:absolute;right:5cqw;top:13cqh;bottom:8cqh;width:40cqw;border-radius:2.4cqh;overflow:hidden;animation:artIn .8s cubic-bezier(.15,.9,.25,1) both;box-shadow:0 0 0 .5cqh rgba(233,196,102,.85),0 0 7cqh rgba(255,200,90,.35)}
.intro.r4 .intro-art{box-shadow:0 0 0 .5cqh rgba(233,196,102,.8),0 0 5cqh rgba(140,180,255,.3)}
.intro-art .art{width:100%;height:100%}
.intro-art .art.ph span{font-size:40cqh}
@keyframes artIn{0%{opacity:0;translate:12cqw 0;scale:1.08}100%{opacity:1;translate:0 0;scale:1}}
.intro-info{position:absolute;left:6cqw;top:50%;translate:0 -50%;width:42cqw;display:flex;flex-direction:column;gap:1.8cqh}
.intro-stars{display:flex;gap:.6cqh;font-size:6cqh;line-height:1}
.intro-stars span{color:#FFD35C;text-shadow:0 0 2cqh rgba(255,200,60,.9);opacity:0;animation:starPop .35s cubic-bezier(.2,1.6,.4,1) forwards}
.intro-cls{display:flex;align-items:center;gap:1.4cqh;font-size:3.4cqh;font-weight:800;color:#F6E2A8;letter-spacing:.1em;opacity:0;animation:fadeUp .5s .5s forwards}
.intro-cls i{width:6.5cqh;height:6.5cqh;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;font-size:3.6cqh;background:#140F3A;border:.4cqh solid #E1B54A;color:#FFE7A6}
.intro-cls em{font-style:normal;font-size:2.4cqh;letter-spacing:.05em;background:#C2356F;color:#fff;padding:.3cqh 1.4cqh;border-radius:1cqh}
.intro-name{font-size:8.5cqh;font-weight:900;line-height:1.15;text-shadow:0 0 3cqh rgba(255,210,120,.45),0 .6cqh 1.4cqh rgba(0,0,0,.8);opacity:0;animation:nameIn .6s .65s cubic-bezier(.2,.9,.3,1) forwards;word-break:break-word}
@keyframes nameIn{0%{opacity:0;translate:-3cqw 0;letter-spacing:.3em}100%{opacity:1;translate:0 0;letter-spacing:.02em}}
.intro-line{font-size:3.5cqh;line-height:1.6;color:#EDE9FF;min-height:11cqh;background:linear-gradient(90deg,rgba(10,8,40,.75),rgba(10,8,40,0));border-left:.5cqh solid #E1B54A;padding:1.2cqh 2cqh}
.caret{display:inline-block;width:.35cqh;height:3.2cqh;background:#fff;margin-left:.4cqh;vertical-align:-.4cqh;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tap-hint{position:absolute;right:3cqw;bottom:3cqh;font-size:max(11px,2.6cqh);color:rgba(255,255,255,.7);animation:blink 1.4s steps(1) infinite}

/* HUD */
.hud{position:absolute;top:2.4cqh;left:2.4cqw;right:2.4cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:1cqw;z-index:20;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-count{font-size:max(12px,2.8cqh);font-weight:800;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:.6cqh 1.8cqh;border-radius:99px;font-variant-numeric:tabular-nums}
.hud-r{display:flex;gap:1cqw;flex-wrap:wrap;justify-content:flex-end}
.hbtn{font-size:max(12px,2.6cqh);font-weight:700;color:#fff;background:rgba(10,10,30,.55);border:1px solid rgba(255,255,255,.3);padding:0 max(10px,2cqh);height:max(34px,6.4cqh);border-radius:99px;white-space:nowrap}
.hbtn.strong{background:rgba(255,255,255,.92);color:#1A1440;font-weight:800}
.st-hint{position:absolute;bottom:2.4cqh;left:0;right:0;text-align:center;font-size:max(11px,2.3cqh);color:rgba(255,255,255,.4);pointer-events:none;z-index:5}

/* 結果 */
.results{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqh;background:radial-gradient(90% 90% at 50% 50%,rgba(28,30,90,.85),rgba(3,4,16,.96));animation:fade .4s;cursor:default}
.res-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2cqh 1.3cqw;width:92cqw}
.mini{width:12.2cqw;opacity:0;animation:miniIn .4s cubic-bezier(.2,1.3,.4,1) forwards;display:flex;flex-direction:column;align-items:center;gap:.6cqh}
.mini>.mini-in{position:relative;width:100%;aspect-ratio:.64;border-radius:1cqw;padding:.35cqw;background:var(--frame)}
.mini-in>.art,.mini-in>.ce-art{position:relative;inset:auto;width:100%;height:100%;border-radius:.7cqw;overflow:hidden}
.mini-in>.art.ph span{font-size:5cqw}
.mini-in>.ce-art span{font-size:1.8cqw}
.mini.fr-gold>.mini-in{box-shadow:0 0 2.4cqh rgba(255,200,70,.55)}
.mini.shine>.mini-in::after{content:"";position:absolute;inset:0;border-radius:1cqw;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.mini-foot{position:absolute;left:.35cqw;right:.35cqw;bottom:.35cqw;padding:2cqh 0 .6cqh;background:linear-gradient(transparent,rgba(6,4,24,.9));border-radius:0 0 .7cqw .7cqw;text-align:center}
.mini-stars{color:#FFD35C;font-size:1.5cqw;letter-spacing:-.15cqw}
.mini.fr-silver .mini-stars{color:#E6EBF2}
.mini-pu{position:absolute;top:.5cqw;right:.5cqw;background:#C2356F;color:#fff;font-size:1.2cqw;font-weight:900;padding:0 .6cqw;border-radius:.5cqw}
.mini-name{font-size:max(9px,1.25cqw);font-weight:700;color:#E6E3F7;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes miniIn{0%{opacity:0;translate:0 3cqh;scale:.7}100%{opacity:1;translate:0 0;scale:1}}
.res-grid.single .mini{width:24cqw}
.res-grid.single .mini-stars{font-size:2.6cqw}
.res-grid.single .mini-name{font-size:max(12px,2.2cqw)}
.res-bar{display:flex;gap:1.6cqw}
.rbtn{height:max(40px,8.5cqh);padding:0 max(14px,3.2cqw);border-radius:99px;font-size:max(13px,3cqh);font-weight:800;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.rbtn small{font-size:.8em;opacity:.8;margin-left:.3em}
.rbtn.gold{background:linear-gradient(180deg,#F7C95A,#D98A13);color:#3A2200;border:0}
.res-stones{font-size:max(11px,2.4cqh);color:rgba(255,255,255,.55);margin-top:-1.6cqh}

@media (prefers-reduced-motion:reduce){
  .stage *,.stage{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card3d.spin .card-inner{animation:none}
}
