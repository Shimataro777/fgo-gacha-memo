<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FGOガチャ記録</title>
<meta name="description" content="ガチャの結果を記録して、いつでも見返せる召喚のログ帳">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ガチャ記録">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
/* ================================================================
   基本方針：白地・細い線・色はアクセント1色（ローズ）と★5PUの金だけ。
   影は浮いているもの（FAB・トースト・シート）以外に付けない。
   ================================================================ */
:root{
  --ink:#1C1A21; --ink2:#5E5A66; --ink3:#9C98A3;
  --line:#ECEAEF; --line2:#DEDBE3; --soft:#F6F5F8;
  --ac:#C2356F; --ac-soft:#FBF1F5; --ac-line:#F2D3E0;
  --gold:#B07A09; --danger:#C62D4A;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --tabh:60px; --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#fff;-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
body{font-family:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;color:var(--ink);background:#fff;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
input,select,textarea{font-size:16px}
img{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{min-height:100vh;padding-bottom:calc(var(--tabh) + var(--safe-b) + 24px)}
.app-head{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.ah-in{max-width:720px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 calc(8px + var(--safe-r)) 0 calc(18px + var(--safe-l))}
.app-head h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
.ah-mark{width:22px;height:15px;border:2px solid var(--ac);border-radius:4px;position:relative;flex:none}
.ah-mark::before{content:"";position:absolute;left:62%;top:-1px;bottom:-1px;border-left:1.5px dashed var(--ac)}
.app-main{max-width:720px;margin:0 auto;padding:18px calc(18px + var(--safe-r)) 0 calc(18px + var(--safe-l))}
.page{display:flex;flex-direction:column;gap:16px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:0 var(--safe-r) var(--safe-b) var(--safe-l)}
.tab{flex:1;max-width:140px;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px;font-weight:700}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ac)}

.fab{position:fixed;z-index:35;right:calc(18px + var(--safe-r));bottom:calc(var(--tabh) + var(--safe-b) + 16px);display:flex;align-items:center;gap:6px;height:50px;padding:0 20px 0 16px;border-radius:25px;background:var(--ac);color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 16px -6px rgba(120,20,70,.45)}
.fab svg{width:20px;height:20px}
.fab:active{transform:scale(.97)}
@media (min-width:760px){.fab{right:calc(50% - 342px)}}

@media (orientation:landscape) and (max-height:520px){
  :root{--tabh:0px}
  .app{padding-left:calc(72px + var(--safe-l));padding-bottom:calc(24px + var(--safe-b))}
  .tabbar{top:0;bottom:0;right:auto;width:calc(72px + var(--safe-l));flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line);padding:var(--safe-t) 0 var(--safe-b) var(--safe-l)}
  .tab{flex:none;height:62px;max-width:none}
  .fab{bottom:calc(16px + var(--safe-b))}
}

/* ---------- parts ---------- */
.icon-btn{width:42px;height:42px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:active{background:var(--soft)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn:active{opacity:.8}
.btn svg{width:18px;height:18px}
.btn.sm{height:36px;font-size:13px;padding:0 13px;border-radius:10px}
.btn.primary{background:var(--ac);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}
.btn.gold{background:var(--ac);color:#fff}
.btn.danger-ghost{background:#fff;border:1px solid var(--line2);color:var(--danger)}
.btn.block{width:100%;justify-content:center}
.btn.grow{flex:1}
.btn.big{height:58px;flex-direction:column;gap:0;font-size:15.5px;border-radius:14px}
.btn.big small{font-size:11.5px;font-weight:600;opacity:.75}
.text-btn{height:40px;padding:0 8px;font-size:15px;color:var(--ink2)}
.text-btn.strong{color:var(--ac);font-weight:800}
.link{color:var(--ac);font-weight:700;font-size:inherit}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.card-pad{padding:2px 16px}
.card-sep{height:1px;background:var(--line)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:800}
.card-h span{font-size:12px;color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.65}
.muted{color:var(--ink3);font-size:13px}
.muted-c{color:var(--ink3)}
.gold-t{color:var(--gold)}
.sec-h{font-size:13px;font-weight:700;color:var(--ink2);margin:6px 0 -6px}
.sub-h{font-size:12.5px;font-weight:700;color:var(--ink3);margin:20px 0 8px}
.sub-h:first-child{margin-top:0}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.num.gold{color:var(--gold)}
.unit{font-size:12px;color:var(--ink3);margin-left:2px;font-weight:600}
.input{width:100%;height:46px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:0 12px;font-size:16px}
textarea.input{height:auto;padding:11px 12px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--ac)}
.input.invalid{border-color:var(--danger)}
.empty{text-align:center;padding:48px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-ic{color:var(--ink3);margin-bottom:4px}
.empty-t{font-weight:800;font-size:15px}
.empty-d{font-size:13px;color:var(--ink3);margin-bottom:12px}
.ttag{font-size:12px;color:var(--ink2)}
.ttag.t-gold{color:var(--gold);font-weight:700}

/* chips */
.chips-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips-row::-webkit-scrollbar{display:none}
.chips-row.wrap{flex-wrap:wrap;overflow:visible}
.fchip,.chip-sel{flex:none;height:34px;border-radius:17px;border:1px solid var(--line2);background:#fff;padding:0 13px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.fchip.on,.chip-sel.on{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--soft)}
.chip-sel{padding:0 8px 0 13px}
.chip-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:13px;font-weight:inherit;color:inherit;height:100%;cursor:pointer}
.chip-sel svg{width:14px;height:14px;pointer-events:none}
.qchip{height:32px;padding:0 12px;border-radius:16px;background:#fff;border:1px solid var(--line2);font-size:13px;color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.qchip.on{border-color:var(--ink);color:var(--ink);font-weight:700}

.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink3)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.seg.sm button{height:30px;font-size:12.5px}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;height:42px;background:#fff;flex:none}
.stepper button{width:42px;height:100%;font-size:19px;color:var(--ink2);display:grid;place-items:center}
.stepper button:disabled{color:var(--line2);opacity:1}
.stepper button:active:not(:disabled){background:var(--soft)}
.stepper input{width:46px;height:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:700;font-size:16px;-moz-appearance:textfield;background:transparent}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none}
.stepper input:focus{outline:none;background:var(--soft)}
.stepper.sm{height:40px}
.stepper.sm button{width:36px}
.stepper.sm input{width:38px}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;cursor:pointer}
.toggle-row+.toggle-row{border-top:1px solid var(--line)}
.tr-text{display:flex;flex-direction:column;min-width:0}
.tr-label{font-size:14px;font-weight:600}
.tr-desc{font-size:12px;color:var(--ink3)}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch:checked{background:var(--ac)}
.switch:checked::after{transform:translateX(18px)}

.toast{position:fixed;z-index:400;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 80px);transform:translateX(-50%);background:#26222B;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px -10px rgba(0,0,0,.4);animation:toastIn .25s var(--ease);max-width:calc(100vw - 32px)}
.toast button{color:#FFB3CF;font-weight:700;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- sheet ---------- */
.sheet-back{position:fixed;inset:0;z-index:100;background:rgba(20,15,25,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:sheetUp .28s var(--ease);padding-left:var(--safe-l);padding-right:var(--safe-r)}
.sheet-back.full .sheet{max-height:100%;height:100%;border-radius:0;max-width:640px}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:18px;max-height:86vh}.sheet-back.full .sheet{height:92vh;border-radius:18px}}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);flex:none}
.sheet-back.full .sheet-head{padding-top:calc(6px + var(--safe-t))}
@media (min-width:700px){.sheet-back.full .sheet-head{padding-top:6px}}
.sheet-head h2{font-size:15px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-side{display:flex;align-items:center}
.sh-side.right{justify-content:flex-end}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 22px;flex:1;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:#fff}
.foot-actions{display:flex;gap:8px}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* ---------- records ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:2px 0 16px;border-bottom:1px solid var(--line)}
.sum-item{display:flex;flex-direction:column;min-width:0}
.sum-item+.sum-item{padding-left:14px;border-left:1px solid var(--line)}
.sum-item+.sum-item{margin-left:0}
.sum-lbl{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.sum-item .num{font-size:22px}
.filters{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:6px;height:44px;border-radius:10px;padding:0 4px 0 12px;background:var(--soft)}
.search>svg{color:var(--ink3);width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;height:100%;background:transparent}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{display:none}
.hit-count{font-size:12.5px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.month{display:flex;flex-direction:column;gap:6px}
.month-head{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 0}
.month-head h3{font-size:14px;font-weight:800}
.month-head span{font-size:12px;color:var(--ink3)}
.rec-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rec{display:grid;grid-template-columns:34px minmax(0,1fr) 16px;gap:12px;align-items:start;width:100%;text-align:left;background:#fff;padding:13px 12px 13px 14px}
.rec+.rec{border-top:1px solid var(--line)}
.rec:active{background:var(--soft)}
.rec-date{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding-top:1px}
.rd-d{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.rd-d.sm{font-size:13px}
.rd-w{font-size:11px;color:var(--ink3);margin-top:3px}
.rec-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.rec-top{display:flex;align-items:baseline;gap:10px}
.rec-title{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-pulls{font-size:12px;color:var(--ink3);white-space:nowrap}
.rec-pulls b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:1px}
.rec-res{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2)}
.rec-res.none{color:var(--ink3);font-size:12.5px}
.res{display:inline-flex;align-items:baseline;gap:5px;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res em{font-style:normal;font-size:11px;color:var(--ink3);font-weight:700}
.res.pu5{color:var(--ink);font-weight:700}
.res.pu5 em{color:var(--gold)}
.res small{font-size:11.5px;color:var(--ink3)}
.res.more{color:var(--ink3)}
.rec-flags{display:flex;gap:10px;font-size:11.5px;color:var(--ac)}
.rec-chev{width:16px;height:16px;color:var(--line2);align-self:center}

.detail-head{margin-bottom:16px}
.dh-date{font-size:12.5px;color:var(--ink3)}
.dh-title{font-size:19px;font-weight:800;line-height:1.35;word-break:break-word}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.kv{display:flex;flex-direction:column;padding:0 12px}
.kv:first-child{padding-left:0}
.kv+.kv{border-left:1px solid var(--line)}
.kv span{font-size:11.5px;color:var(--ink3)}
.kv b{font-size:20px;font-variant-numeric:tabular-nums}
.kv small{font-size:11.5px;margin-left:2px;color:var(--ink3);font-weight:600}
.breakdown{font-size:12.5px;color:var(--ink3);margin-top:8px}
.res-detail li{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0}
.res-detail li+li{border-top:1px solid var(--line)}
.res-detail img,.rd-ph{width:32px;height:32px;border-radius:8px;object-fit:cover}
.rd-ph{display:grid;place-items:center;background:var(--soft);color:var(--ink3);font-weight:700;font-size:13px}
.rdn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdt{font-size:12px;color:var(--ink3)}
.rdt.pu5{color:var(--gold);font-weight:700}
.res-detail b{font-variant-numeric:tabular-nums;font-weight:700;min-width:28px;text-align:right}
.memo{white-space:pre-wrap;font-size:14px;color:var(--ink2)}

/* ---------- editor ---------- */
.form-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.form-sec:first-child{padding-top:0}
.form-sec:last-child{border-bottom:0}
.f-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:8px}
.f-hint{font-size:12px;color:var(--ink3);font-weight:500}
.f-sub{font-size:12px;color:var(--ink3);margin-bottom:6px}
.f-err{color:var(--danger);font-size:12.5px;margin-top:6px}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick-row.servants{margin:0 0 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.quick-row.servants::-webkit-scrollbar{display:none}
.date-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.date-row .input{min-width:0}
.pull-grid{display:flex;flex-direction:column;gap:8px}
.pull-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr-l{font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:8px}
.pr-l small{font-size:11.5px;color:var(--ink3);font-weight:500}
.total-box{display:flex;margin-top:12px;background:var(--soft);border-radius:10px;padding:10px 4px}
.total-box>div{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;font-size:12px;color:var(--ink3)}
.total-box>div+div{border-left:1px solid var(--line2)}
.total-box b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.svchip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 3px;border-radius:18px;background:#fff;border:1px solid var(--line2);font-size:13px}
.svchip img,.svchip i{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.svchip i{display:grid;place-items:center;background:var(--soft);font-style:normal;font-size:12px;color:var(--ink3)}
.svchip:active{background:var(--soft)}
.res-rows{display:flex;flex-direction:column;gap:8px}
.res-row{border:1px solid var(--line2);border-radius:12px;padding:8px 8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.rr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.type-sel{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink2);font-weight:700;font-size:13px;height:30px;padding:0 20px 0 2px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 9px) 13px,calc(100% - 5px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.rr-bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.rr-bottom .input{height:40px;min-width:0}
.add-types{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.at-l{font-size:12px;color:var(--ink3);margin-right:2px}
.add-type{height:32px;padding:0 11px;border-radius:16px;border:1px dashed var(--line2);color:var(--ink2);font-size:12.5px;white-space:nowrap}
.add-type:active{background:var(--soft)}

/* ---------- stats ---------- */
.hero-stat{padding:18px 16px}
.hs-main{display:flex;flex-direction:column}
.hs-lbl{font-size:12px;color:var(--ink3)}
.num.xl{font-size:36px;line-height:1.2}
.hs-sub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hs-sub>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink3)}
.hs-sub b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.rate-list{padding:0 16px}
.rate-row{display:grid;grid-template-columns:1fr auto 70px;gap:12px;align-items:baseline;padding:11px 0;font-size:14px}
.rate-row+.rate-row{border-top:1px solid var(--line)}
.rate-row b{font-size:17px;font-variant-numeric:tabular-nums}
.rate-row small{font-size:11.5px;color:var(--ink3);margin-left:2px;font-weight:500}
.rate-row .rp{text-align:right;color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.rate-row.gold .rl,.rate-row.gold b{color:var(--gold);font-weight:700}
.month-chart{padding:16px 14px 12px}
.mc-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;height:150px;align-items:end}
.mc-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.mc-v{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mc-bar{width:100%;max-width:22px;min-height:2px;border-radius:4px 4px 1px 1px;background:var(--line2);position:relative;display:flex;justify-content:center}
.mc-m{font-size:11px;color:var(--ink3)}
.mc-five{position:absolute;top:-3px;transform:translateY(-100%);min-width:16px;height:16px;border-radius:8px;background:#fff;border:1px solid var(--gold);color:var(--gold);font-size:9.5px;font-weight:700;font-style:normal;display:grid;place-items:center}
.mc-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-top:10px}
.mc-five.dot{position:static;transform:none;width:10px;min-width:10px;height:10px}
.rank{padding:0 16px}
.rank-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0}
.rank-row+.rank-row{border-top:1px solid var(--line)}
.rk{font-weight:700;color:var(--ink3);text-align:center;font-size:13px}
.rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline}
.rv em{font-style:normal;font-size:11.5px;color:var(--gold);font-weight:600}

/* ---------- gallery ---------- */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 12px}
.gcard{display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left;min-width:0}
.g-img{position:relative;display:block;aspect-ratio:.72;border-radius:10px;overflow:hidden;background:var(--soft)}
.g-img.add{display:grid;place-items:center;color:var(--ink3);border:1px dashed var(--line2);background:#fff}
.g-img.big{width:124px;flex:none}
.g-pu{position:absolute;top:6px;left:6px;background:var(--ac);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px}
.g-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-meta{font-size:11px;color:var(--ink3);display:flex;gap:6px;white-space:nowrap;overflow:hidden}
.art{width:100%;height:100%;object-fit:cover;display:block}
.art.ph{display:grid;place-items:center;background:var(--soft)}
.art.ph span{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;color:var(--line2);font-size:38px}
/* 召喚演出の中だけは、クラスごとの色で華やかに */
.stage .art.ph{background:radial-gradient(circle at 50% 35%,hsl(var(--h) 60% 55%),hsl(var(--h) 55% 22%) 70%,hsl(var(--h) 60% 12%))}
.stage .art.ph span{color:rgba(255,255,255,.88);text-shadow:0 2px 10px rgba(0,0,0,.35)}
.fr-gold{--frame:linear-gradient(145deg,#FFF1BF,#E1A52A 28%,#FFE89A 52%,#B97B12 78%,#F7D57A)}
.fr-silver{--frame:linear-gradient(145deg,#F6F8FB,#AFB7C4 30%,#EEF1F6 55%,#8A93A2 80%,#D9DEE7)}
.fr-bronze{--frame:linear-gradient(145deg,#F2D1B0,#A8683A 35%,#E6BD92 60%,#7A4724)}
.sv-detail{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.svd-info{min-width:0}
.svd-stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.svd-cls{font-size:13px;color:var(--ink3);margin-top:2px}
.svd-cls i{font-style:normal;font-weight:700;margin-right:6px;color:var(--ink2)}
.svd-name{font-size:20px;font-weight:800;line-height:1.3;margin-top:2px;word-break:break-word}
.svd-line{font-size:13px;color:var(--ink2);margin-top:8px}
.img-pick{display:flex;gap:16px;align-items:center}
.g-img.pick{cursor:pointer;border:1px dashed var(--line2);background:#fff}
.pick-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-size:12px}
.pick-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.cls-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px 0 4px;border-radius:9px;border:1px solid var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.cls-btn i{width:26px;height:26px;border-radius:6px;background:var(--soft);font-style:normal;font-weight:800;display:grid;place-items:center;flex:none}
.cls-btn.on{border-color:var(--ink);color:var(--ink);font-weight:700}

.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left}
.menu button+button{border-top:1px solid var(--line)}
.menu button:active{background:var(--soft)}
.menu svg{color:var(--ink2);flex:none}
.menu span{display:flex;flex-direction:column}
.menu b{font-size:14.5px;font-weight:600}
.menu small{font-size:12px;color:var(--ink3)}
.menu .danger svg,.menu .danger b{color:var(--danger)}
.ver{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:18px}

/* ---------- summon lobby ---------- */
.pu-card{padding:16px}
.pu-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0}
.pu-row+.pu-row{border-top:1px solid var(--line)}
.pu-lbl{font-weight:800;font-size:14px;padding-top:26px}
.pu-row:first-child .pu-lbl{color:var(--gold)}
.pu-slots{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.pu-slots::-webkit-scrollbar{display:none}
.pu-slot,.pu-add{position:relative;flex:none;width:64px;display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center}
.pu-img{display:block;width:64px;height:86px;border-radius:9px;overflow:hidden;background:var(--soft)}
.pu-img .art.ph span{font-size:24px}
.pu-img.add{display:grid;place-items:center;border:1px dashed var(--line2);background:#fff;color:var(--ink3)}
.pu-name{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.pu-add .pu-name{color:var(--ink3)}
.pu-x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line2);color:var(--ink2);font-size:14px;line-height:1;display:grid;place-items:center}
.pu-card .note{margin-top:8px}
.stone-row{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.sc-l{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;flex:none}
.quartz{width:16px;height:16px;flex:none;display:inline-block}
.sc-in{width:100px;height:40px;text-align:right;font-weight:700}
.sc-in:disabled{color:var(--ink3);background:var(--soft)}
.sc-quick{display:flex;gap:6px;margin-left:auto}
.pull-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.sim-tot{padding:0 16px}
.st-row{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:baseline;padding:10px 0;font-size:14px}
.st-row+.st-row{border-top:1px solid var(--line)}
.st-row b{font-size:16px;font-variant-numeric:tabular-nums}
.st-row b small{font-size:11.5px;color:var(--ink3);margin-left:2px;font-weight:500}
.st-row>span:last-child{text-align:right;color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.st-row.gold>span:first-child,.st-row.gold b{color:var(--gold);font-weight:700}
.st-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);padding:11px 0;border-top:1px solid var(--line)}
.rates{padding:0 16px}
.rates summary{padding:13px 0;font-weight:700;font-size:14px;cursor:pointer}
.rates table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.rates td{padding:7px 0;border-top:1px solid var(--line);color:var(--ink2)}
.rates td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.rates .note{padding-bottom:12px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 10px}
.pick-item{display:flex;flex-direction:column;gap:5px;min-width:0;text-align:center}
.pi-img{position:relative;display:block;aspect-ratio:.72;border-radius:10px;overflow:hidden;background:var(--soft);outline:2px solid transparent;outline-offset:2px}
.pi-img.new{display:grid;place-items:center;border:1px dashed var(--line2);background:#fff;color:var(--ink3)}
.pick-item.on .pi-img{outline-color:var(--ac)}
.pi-check{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.pi-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.pick-item.on .pi-name{color:var(--ink);font-weight:700}

/* ================================================================
   召喚演出（全画面・16:9のステージ）
   ================================================================ */
.summon{position:fixed;inset:0;z-index:300;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sv-viewport{position:absolute;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;container-type:size}
.summon.rot .sv-viewport{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
.stage{position:relative;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;overflow:hidden;container-type:size;cursor:pointer;color:#fff;font-family:'Noto Sans JP',sans-serif;
  --rc:#8FD8FF;--mc:#8FD2FF}
.stage.ring-gold{--rc:#FFD24D}
.stage.ring-rainbow{--rc:#FFFFFF}
.st-bg{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 62%,#1C2B6B 0%,#0C1236 45%,#03040E 100%)}
.st-bg::after{content:"";position:absolute;inset:0;opacity:.6;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 76% 18%,#fff,transparent),radial-gradient(1px 1px at 88% 60%,#fff,transparent),radial-gradient(1px 1px at 55% 12%,#fff,transparent),radial-gradient(1px 1px at 6% 86%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 88%,#fff,transparent)}
.st-floor{position:absolute;left:0;right:0;bottom:0;height:45%;background:radial-gradient(60% 70% at 50% 40%,rgba(80,140,255,.22),transparent 70%)}
.ph-rings.ring-gold .st-floor{background:radial-gradient(60% 70% at 50% 40%,rgba(255,200,70,.35),transparent 70%)}
.ph-rings.ring-rainbow .st-floor{background:radial-gradient(60% 70% at 50% 40%,rgba(255,120,220,.4),transparent 70%);animation:hue 1.1s linear infinite}

/* 魔法陣 */
.st-circle{position:absolute;left:50%;top:64%;width:92cqh;aspect-ratio:1;translate:-50% -50%;transform:perspective(90cqh) rotateX(64deg);color:var(--mc);transition:opacity .6s,filter .6s;filter:drop-shadow(0 0 1.2cqh var(--mc))}
.st-circle.dim{opacity:.22;filter:none}
.ph-rings .st-circle{--mc:var(--rc);filter:drop-shadow(0 0 2cqh var(--rc)) brightness(1.25)}
.ph-rings.ring-rainbow .st-circle{--mc:#ff7ad9;animation:hue .9s linear infinite}
.mc{width:100%;height:100%;overflow:visible}
.mc circle,.mc line,.mc polyline,.mc polygon,.mc ellipse{fill:none;stroke:currentColor;stroke-width:1.1;vector-effect:non-scaling-stroke}
.mc-l1,.mc-l2,.mc-l3,.mc-l4{transform-box:fill-box;transform-origin:center}
.stage .mc-l1{animation:mcspin 22s linear infinite}
.stage .mc-l2{animation:mcspin 30s linear infinite reverse}
.stage .mc-l3{animation:mcspin 16s linear infinite}
.stage .mc-l4{animation:mcspin 9s linear infinite reverse}
.ph-circle .mc-l1{animation-duration:7s}.ph-circle .mc-l2{animation-duration:9s}.ph-circle .mc-l3{animation-duration:5s}
.ph-rings .mc-l1{animation-duration:2.4s}.ph-rings .mc-l2{animation-duration:3s}.ph-rings .mc-l3{animation-duration:1.6s}.ph-rings .mc-l4{animation-duration:1s}
@keyframes mcspin{to{rotate:360deg}}
@keyframes hue{to{filter:hue-rotate(360deg)}}

/* 集まる光 */
.particles{position:absolute;left:50%;top:52%;width:0;height:0}
.particles i{position:absolute;width:calc(1.1cqh * var(--s));height:calc(1.1cqh * var(--s));border-radius:50%;background:#fff;box-shadow:0 0 1.4cqh 0.4cqh var(--mc);opacity:0;animation:gather 1s ease-in infinite}
@keyframes gather{0%{opacity:0;transform:rotate(var(--a)) translateY(var(--d))}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(0)}}

/* 中央の光 */
.st-orb{position:absolute;left:50%;top:52%;width:16cqh;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,var(--rc) 38%,transparent 70%);animation:orbPulse .9s ease-in-out infinite;mix-blend-mode:screen}
.ph-rings .st-orb{animation:orbGrow var(--tr) cubic-bezier(.5,0,.9,.4) forwards}
.ph-rings.ring-rainbow .st-orb{animation:orbGrow var(--tr) cubic-bezier(.5,0,.9,.4) forwards,hue .8s linear infinite;background:radial-gradient(circle,#fff 0 18%,#ff7ad9 32%,#7ad7ff 46%,transparent 70%)}
@keyframes orbPulse{0%,100%{scale:.55;opacity:.7}50%{scale:.8;opacity:1}}
@keyframes orbGrow{0%{scale:.6}100%{scale:3.4}}

/* 光の環 */
.rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding-top:4cqh}
.ring-g{grid-area:1/1;width:74cqh;aspect-ratio:1;transform:rotate(var(--t)) scaleY(.3);opacity:0;animation:ringIn .45s var(--dl) ease-out forwards;filter:drop-shadow(0 0 1.3cqh var(--rc))}
.ring-g::before{content:"";position:absolute;inset:0;border-radius:50%;border:.5cqh solid var(--rc);opacity:.35}
.ring{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40%,var(--rc) 78%,#fff 90%,transparent 94%);-webkit-mask:radial-gradient(closest-side,transparent 86%,#000 89%,#000 98%,transparent 100%);mask:radial-gradient(closest-side,transparent 86%,#000 89%,#000 98%,transparent 100%);animation:mcspin var(--sp) linear infinite}
.ring-rainbow .ring{background:conic-gradient(from 0deg,#ff4d6d,#ffb84d,#fff34d,#6dff7a,#4dd8ff,#8a6dff,#ff4dd8,#ff4d6d)}
.ring-rainbow .ring-g{filter:drop-shadow(0 0 1.6cqh #fff);animation:ringIn .45s var(--dl) ease-out forwards,hue 1s linear infinite}
.ring-rainbow .ring-g::before{border-color:#fff;opacity:.5}
@keyframes ringIn{0%{opacity:0;scale:.25}70%{opacity:1;scale:1.06}100%{opacity:1;scale:1}}
.ph-rings.ring-gold .ring-g{animation:ringIn .45s var(--dl) ease-out forwards,ringPulse .5s calc(var(--dl) + .45s) ease-in-out infinite}
@keyframes ringPulse{50%{scale:1.05}}
.st-rainbow{position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 52%,rgba(255,80,120,.0),rgba(255,80,120,.28),rgba(255,220,80,.28),rgba(80,255,140,.28),rgba(80,200,255,.28),rgba(160,90,255,.28),rgba(255,80,200,.28),rgba(255,80,120,0));mix-blend-mode:screen;animation:mcspin 3s linear infinite,rbIn var(--tr) ease-in forwards;scale:2}
@keyframes rbIn{0%{opacity:0}100%{opacity:1}}
.ph-rings.ring-rainbow{animation:shake .12s linear infinite}
.ph-rings.ring-gold .rings{animation:shakeS .16s linear infinite}
@keyframes shake{0%{translate:0 0}25%{translate:.25cqw -.2cqh}50%{translate:-.25cqw .2cqh}75%{translate:.2cqw .25cqh}100%{translate:0 0}}
@keyframes shakeS{50%{translate:.12cqw .1cqh}}

/* 閃光 */
.st-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flashA .45s ease-out forwards;pointer-events:none;z-index:6}
.st-flash.gold{background:radial-gradient(circle at 50% 50%,#fff 20%,#FFE39A 70%)}
.st-flash.rainbow{background:radial-gradient(circle at 50% 50%,#fff 22%,#ffd1f0 45%,#bfe9ff 70%);animation:flashA .6s ease-out forwards}
@keyframes flashA{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* カード */
.st-card-wrap{position:absolute;left:50%;top:51%;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;z-index:4;transition:opacity .4s,scale .4s}
.st-card-wrap.away{opacity:0;scale:.9}
.st-card-slot{position:relative;perspective:140cqh}
.card3d{width:32cqh;height:50cqh;position:relative}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.3,.85,.3,1)}
.card3d.spin .card-inner{animation:cardSpin 1.05s cubic-bezier(.1,.7,.2,1) both}
@keyframes cardSpin{0%{transform:translateY(24cqh) scale(.08) rotateY(-1980deg);opacity:0}12%{opacity:1}100%{transform:translateY(0) scale(1) rotateY(0deg);opacity:1}}
.card-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:2.2cqh;padding:1.1cqh;background:var(--frame);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2cqh 5cqh rgba(0,0,0,.55)}
.face.front{transform:rotateY(180deg)}
.card3d.fr-gold .face{box-shadow:0 0 5cqh .6cqh rgba(255,196,60,.55),0 2cqh 5cqh rgba(0,0,0,.5)}
.card3d.promoted{animation:promo .48s ease-out}
@keyframes promo{0%{scale:1}35%{scale:1.1}100%{scale:1}}
.card3d.jolt{animation:jolt .08s linear infinite}
@keyframes jolt{0%{translate:0 0}25%{translate:.5cqh -.3cqh}50%{translate:-.4cqh .4cqh}75%{translate:.3cqh .3cqh}}
.face-in{width:100%;height:100%;border-radius:1.4cqh;overflow:hidden;position:relative}
.cback{background:radial-gradient(circle at 50% 42%,#2D4598,#101A4A 55%,#070B24);display:grid;place-items:center}
.cb-pattern{position:absolute;inset:0;opacity:.35;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.18) 0 4deg,transparent 4deg 15deg),radial-gradient(circle at 50% 42%,transparent 38%,rgba(255,255,255,.2) 39%,transparent 40%,transparent 52%,rgba(255,255,255,.15) 53%,transparent 54%)}
.cb-emblem{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.2cqh}
.cb-k{width:17cqh;height:17cqh;border-radius:50%;display:grid;place-items:center;font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;font-size:9.5cqh;color:#FFE7A6;background:radial-gradient(circle,#2A2468,#0E0B30);border:.6cqh solid #E1B54A;box-shadow:0 0 2.5cqh rgba(255,210,100,.5),inset 0 0 2cqh rgba(0,0,0,.6)}
.cb-n{font-size:2.3cqh;font-weight:800;letter-spacing:.2em;color:#F6E2A8}
.cb-emblem.ce .cb-k{color:#FFD1E6;border-color:#E27FAF;box-shadow:0 0 2.5cqh rgba(255,120,190,.45),inset 0 0 2cqh rgba(0,0,0,.6)}
.cfront{background:#140F35}
.cfront .art{position:absolute;inset:0}
.cfront .art.ph span{font-size:18cqh}
.cf-cls{position:absolute;top:1cqh;left:1cqh;width:6cqh;height:6cqh;border-radius:50%;display:grid;place-items:center;background:rgba(14,11,48,.8);border:.35cqh solid #E1B54A;color:#FFE7A6;font-weight:900;font-size:3.2cqh}
.cf-plate{position:absolute;left:0;right:0;bottom:0;height:10cqh;background:linear-gradient(transparent,rgba(8,6,28,.9) 55%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:1.2cqh}
.cf-stars{color:#FFD35C;font-size:3.2cqh;letter-spacing:-.2cqh;text-shadow:0 0 1cqh rgba(255,200,80,.8)}
.fr-silver .cf-stars{color:#E6EBF2;text-shadow:none}
.ce-art{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1.4cqh,transparent 1.4cqh 2.8cqh),radial-gradient(circle at 50% 40%,#7A3A7E,#2B1238 70%)}
.ce-art.r4,.cfront.ce.r4 .ce-art{background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 1.4cqh,transparent 1.4cqh 2.8cqh),radial-gradient(circle at 50% 40%,#3E6FB0,#132447 70%)}
.ce-art.r3,.cfront.ce.r3 .ce-art{background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 1.4cqh,transparent 1.4cqh 2.8cqh),radial-gradient(circle at 50% 40%,#4B6A58,#1A2A22 70%)}
.ce-art span{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;font-size:6cqh;color:rgba(255,255,255,.75);letter-spacing:.3em;writing-mode:vertical-rl}

/* バチバチ */
.bolts{position:absolute;left:50%;top:50%;width:62cqh;height:87cqh;translate:-50% -50%;pointer-events:none;overflow:visible;z-index:3}
.bolts polyline{fill:none;stroke:#FFF6C8;stroke-width:1.3;stroke-linejoin:bevel;filter:drop-shadow(0 0 1.2px #FFD24D) drop-shadow(0 0 3px #FFB800)}
.bolts g{opacity:0}
.bolts .bg0{animation:bz .21s steps(1) infinite}
.bolts .bg1{animation:bz .21s steps(1) .07s infinite}
.bolts .bg2{animation:bz .21s steps(1) .14s infinite}
@keyframes bz{0%{opacity:1}33%{opacity:0}}

/* ★ */
.st-stars{display:flex;gap:.6cqh;margin-top:2cqh;font-size:5cqh;line-height:1;height:5cqh}
.st-stars span{opacity:0;animation:starPop .32s cubic-bezier(.2,1.6,.4,1) forwards}
.st-stars.gold span{color:#FFD35C;text-shadow:0 0 1.5cqh rgba(255,200,60,.9)}
.st-stars.silver span{color:#E8EDF4;text-shadow:0 0 1cqh rgba(200,220,255,.6)}
@keyframes starPop{0%{opacity:0;scale:2.2}100%{opacity:1;scale:1}}
.st-name{margin-top:1.6cqh;font-size:3.2cqh;font-weight:800;text-shadow:0 0 1.4cqh rgba(0,0,0,.8);opacity:0;animation:fadeUp .4s .5s forwards;max-width:70cqw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fadeUp{from{opacity:0;translate:0 1cqh}to{opacity:1;translate:0 0}}

/* 登場シーン */
.intro{position:absolute;inset:0;z-index:8;background:radial-gradient(80% 110% at 72% 50%,#2E2366,#0B0A24 60%,#030310);animation:fade .45s}
.intro.r5{background:radial-gradient(80% 110% at 72% 50%,#5A3A1A,#1C1030 60%,#05030F)}
.intro-rays{position:absolute;left:72%;top:50%;width:200cqw;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 5deg,transparent 5deg 15deg);animation:mcspin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 10%,transparent 45%);mask:radial-gradient(circle,#000 10%,transparent 45%)}
.intro.r5 .intro-rays{background:repeating-conic-gradient(from 0deg,rgba(255,210,110,.14) 0 5deg,transparent 5deg 15deg)}
.intro-art{position:absolute;right:5cqw;top:13cqh;bottom:8cqh;width:40cqw;border-radius:2.4cqh;overflow:hidden;animation:artIn .8s cubic-bezier(.15,.9,.25,1) both;box-shadow:0 0 0 .5cqh rgba(233,196,102,.85),0 0 7cqh rgba(255,200,90,.35)}
.intro.r4 .intro-art{box-shadow:0 0 0 .5cqh rgba(233,196,102,.8),0 0 5cqh rgba(140,180,255,.3)}
.intro-art .art{width:100%;height:100%}
.intro-art .art.ph span{font-size:40cqh}
@keyframes artIn{0%{opacity:0;translate:12cqw 0;scale:1.08}100%{opacity:1;translate:0 0;scale:1}}
.intro-info{position:absolute;left:6cqw;top:50%;translate:0 -50%;width:42cqw;display:flex;flex-direction:column;gap:1.8cqh}
.intro-stars{display:flex;gap:.6cqh;font-size:6cqh;line-height:1}
.intro-stars span{color:#FFD35C;text-shadow:0 0 2cqh rgba(255,200,60,.9);opacity:0;animation:starPop .35s cubic-bezier(.2,1.6,.4,1) forwards}
.intro-cls{display:flex;align-items:center;gap:1.4cqh;font-size:3.4cqh;font-weight:800;color:#F6E2A8;letter-spacing:.1em;opacity:0;animation:fadeUp .5s .5s forwards}
.intro-cls i{width:6.5cqh;height:6.5cqh;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;font-size:3.6cqh;background:#140F3A;border:.4cqh solid #E1B54A;color:#FFE7A6}
.intro-cls em{font-style:normal;font-size:2.4cqh;letter-spacing:.05em;background:#C2356F;color:#fff;padding:.3cqh 1.4cqh;border-radius:1cqh}
.intro-name{font-size:8.5cqh;font-weight:900;line-height:1.15;text-shadow:0 0 3cqh rgba(255,210,120,.45),0 .6cqh 1.4cqh rgba(0,0,0,.8);opacity:0;animation:nameIn .6s .65s cubic-bezier(.2,.9,.3,1) forwards;word-break:break-word}
@keyframes nameIn{0%{opacity:0;translate:-3cqw 0;letter-spacing:.3em}100%{opacity:1;translate:0 0;letter-spacing:.02em}}
.intro-line{font-size:3.5cqh;line-height:1.6;color:#EDE9FF;min-height:11cqh;background:linear-gradient(90deg,rgba(10,8,40,.75),rgba(10,8,40,0));border-left:.5cqh solid #E1B54A;padding:1.2cqh 2cqh}
.caret{display:inline-block;width:.35cqh;height:3.2cqh;background:#fff;margin-left:.4cqh;vertical-align:-.4cqh;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tap-hint{position:absolute;right:3cqw;bottom:3cqh;font-size:max(11px,2.6cqh);color:rgba(255,255,255,.7);animation:blink 1.4s steps(1) infinite}

/* HUD */
.hud{position:absolute;top:2.4cqh;left:2.4cqw;right:2.4cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:1cqw;z-index:20;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-count{font-size:max(12px,2.8cqh);font-weight:800;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:.6cqh 1.8cqh;border-radius:99px;font-variant-numeric:tabular-nums}
.hud-r{display:flex;gap:1cqw;flex-wrap:wrap;justify-content:flex-end}
.hbtn{font-size:max(12px,2.6cqh);font-weight:700;color:#fff;background:rgba(10,10,30,.55);border:1px solid rgba(255,255,255,.3);padding:0 max(10px,2cqh);height:max(34px,6.4cqh);border-radius:99px;white-space:nowrap}
.hbtn.strong{background:rgba(255,255,255,.92);color:#1A1440;font-weight:800}
.st-hint{position:absolute;bottom:2.4cqh;left:0;right:0;text-align:center;font-size:max(11px,2.3cqh);color:rgba(255,255,255,.4);pointer-events:none;z-index:5}

/* 結果 */
.results{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqh;background:radial-gradient(90% 90% at 50% 50%,rgba(28,30,90,.85),rgba(3,4,16,.96));animation:fade .4s;cursor:default}
.res-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2cqh 1.3cqw;width:92cqw}
.mini{width:12.2cqw;opacity:0;animation:miniIn .4s cubic-bezier(.2,1.3,.4,1) forwards;display:flex;flex-direction:column;align-items:center;gap:.6cqh}
.mini>.mini-in{position:relative;width:100%;aspect-ratio:.64;border-radius:1cqw;padding:.35cqw;background:var(--frame)}
.mini-in>.art,.mini-in>.ce-art{position:relative;inset:auto;width:100%;height:100%;border-radius:.7cqw;overflow:hidden}
.mini-in>.art.ph span{font-size:5cqw}
.mini-in>.ce-art span{font-size:1.8cqw}
.mini.fr-gold>.mini-in{box-shadow:0 0 2.4cqh rgba(255,200,70,.55)}
.mini.shine>.mini-in::after{content:"";position:absolute;inset:0;border-radius:1cqw;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.mini-foot{position:absolute;left:.35cqw;right:.35cqw;bottom:.35cqw;padding:2cqh 0 .6cqh;background:linear-gradient(transparent,rgba(6,4,24,.9));border-radius:0 0 .7cqw .7cqw;text-align:center}
.mini-stars{color:#FFD35C;font-size:1.5cqw;letter-spacing:-.15cqw}
.mini.fr-silver .mini-stars{color:#E6EBF2}
.mini-pu{position:absolute;top:.5cqw;right:.5cqw;background:#C2356F;color:#fff;font-size:1.2cqw;font-weight:900;padding:0 .6cqw;border-radius:.5cqw}
.mini-name{font-size:max(9px,1.25cqw);font-weight:700;color:#E6E3F7;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes miniIn{0%{opacity:0;translate:0 3cqh;scale:.7}100%{opacity:1;translate:0 0;scale:1}}
.res-grid.single .mini{width:24cqw}
.res-grid.single .mini-stars{font-size:2.6cqw}
.res-grid.single .mini-name{font-size:max(12px,2.2cqw)}
.res-bar{display:flex;gap:1.6cqw}
.rbtn{height:max(40px,8.5cqh);padding:0 max(14px,3.2cqw);border-radius:99px;font-size:max(13px,3cqh);font-weight:800;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.rbtn small{font-size:.8em;opacity:.8;margin-left:.3em}
.rbtn.gold{background:linear-gradient(180deg,#F7C95A,#D98A13);color:#3A2200;border:0}
.res-stones{font-size:max(11px,2.4cqh);color:rgba(255,255,255,.55);margin-top:-1.6cqh}

@media (prefers-reduced-motion:reduce){
  .stage *,.stage{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card3d.spin .card-inner{animation:none}
}

/* ---------- 記録の写真 ---------- */
.rec-cam{font-size:11px;color:var(--ink3);white-space:nowrap;flex:none}
.ph-blank{display:block;background:var(--soft)}
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.img-cell{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--soft)}
.img-thumb{width:100%;height:100%;object-fit:cover;display:block}
.img-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center}
.img-x svg{width:15px;height:15px}
.img-view{display:grid;gap:3px;border-radius:14px;overflow:hidden;background:var(--soft);margin-bottom:16px}
.img-view.n1{grid-template-columns:1fr;aspect-ratio:4/3}
.img-view.n2{grid-template-columns:1fr 1fr;aspect-ratio:3/2}
.img-view.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:3/2}
.img-view.n3 .img-view-cell:first-child{grid-row:span 2}
.img-view.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:3/2}
.img-view-cell{display:block;padding:0;overflow:hidden}
.img-view-cell .img-thumb{transition:transform .15s}
.img-view-cell:active .img-thumb{transform:scale(1.04)}

.pv-back{position:fixed;inset:0;z-index:500;background:rgba(6,5,9,.96);display:flex;flex-direction:column;animation:fade .2s}
.pv-top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 14px 10px;flex:none}
.pv-count{color:rgba(255,255,255,.7);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pv-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;margin-left:auto}
.pv-x svg{width:18px;height:18px}
.pv-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv-img{max-width:100%;max-height:100%;object-fit:contain}
.pv-nav{position:absolute;top:0;bottom:0;width:25%;display:flex;align-items:center;color:rgba(255,255,255,.5)}
.pv-nav.left{left:0;justify-content:flex-start;padding-left:8px}
.pv-nav.right{right:0;justify-content:flex-end;padding-right:8px}
.pv-nav svg{width:22px;height:22px;opacity:.6}
.pv-dots{display:flex;justify-content:center;gap:6px;padding:14px 0 calc(14px + var(--safe-b));flex:none}
.pv-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.pv-dot.on{background:#fff}

</style>
