<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>奪え！マンゴー！</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #d1c29b;
            color: #2c221e;
            font-family: 'DotGothic16', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-header, .game-footer {
            height: 48px;
            background: #b89775;
            border-top: 3px solid #8c6747;
            border-bottom: 3px solid #8c6747;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 30;
            flex-shrink: 0;
            font-size: 12px;
            color: #5c3a21;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .game-header {
            border-top: none;
            justify-content: flex-end; /* 右側に配置 */
            transform: rotate(180deg); /* 180度回転 */
        }
        .game-footer {
            border-bottom: none;
            justify-content: flex-end;
        }

        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            position: relative;
            border-bottom: 3px solid #6b5344;
            background: #ecdcc2;
            transition: background 0.3s;
        }

        #top-player {
            transform: rotate(180deg);
        }

        #bottom-player {
            border-bottom: none;
        }

        #top-player .player-label,
        #bottom-player .player-label {
            display: none;
        }

        @keyframes hit-recoil {
            0% { transform: scale(1) translateX(0); }
            20% { transform: scale(1.15) translateX(-8px) rotate(-5deg); filter: brightness(1.5) sepia(1); }
            40% { transform: scale(1.1) translateX(8px) rotate(5deg); }
            60% { transform: scale(1.05) translateX(-4px); }
            100% { transform: scale(1) translateX(0); }
        }

        .hit-effect {
            animation: hit-recoil 0.35s ease-in-out;
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 140, 20, 0.65) 0%, rgba(200, 30, 0, 0.75) 100%);
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: overlay;
            transition: opacity 0.05s ease-out;
            z-index: 10;
        }

        .flash-active {
            opacity: 1;
        }

        .arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            z-index: 5;
            transform: translateY(20px);
        }

        #top-player .arena {
            transform: translateY(20px);
        }

        .marmot-container {
            width: 90px;
            height: 90px;
            margin-bottom: 2px;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
            image-rendering: pixelated;
            position: relative;
        }

        .marmot-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .marmot-container.waiting-anim .svg-frame-1 {
            display: block;
            animation: toggle-anim-1 0.4s infinite steps(1);
        }

        .marmot-container.waiting-anim .svg-frame-2 {
            display: block;
            animation: toggle-anim-2 0.4s infinite steps(1);
        }

        @keyframes toggle-anim-1 {
            0%, 49.99% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes toggle-anim-2 {
            0%, 49.99% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }

        .marmot-container:not(.waiting-anim) .svg-frame-1 {
            display: block;
        }
        .marmot-container:not(.waiting-anim) .svg-frame-2 {
            display: none;
        }

        .marmot-container.shoot {
            transform: scale(1.3) rotate(10deg);
        }

        .marmot-container.dead {
            filter: grayscale(1) brightness(0.6) opacity(0.7);
            transform: rotate(-90deg) translateY(10px);
        }

        .status-text {
            font-family: 'DotGothic16', monospace;
            font-size: 14px;
            font-weight: bold;
            color: #5c3a21;
            height: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .result-detail {
            font-size: 13px;
            color: #8C6747;
            height: 22px;
            font-weight: bold;
        }

        #global-center-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: transparent;
            border: none;
            border-radius: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: none;
            image-rendering: pixelated;
        }

        .bottom-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            z-index: 5;
            position: relative;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-icons {
            display: flex;
            gap: 2px;
            align-items: center;
            padding: 2px 4px;
            background: #e6d3b3;
            border: 1px solid #bda886;
            border-radius: 4px;
            height: 36px;
        }

        .star-icon {
            font-size: 11px;
            color: #bfa580;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            opacity: 0.3;
        }

        .star-icon.won {
            color: #d4ac0d;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transform: scale(1.1);
            opacity: 1;
        }

        .icon-btn {
            background: #e6d3b3;
            border: 1px solid #bda886;
            border-radius: 4px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            color: #4a3324;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .icon-btn:active {
            background: #d4bc95;
        }

        .action-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #704b2b;
            color: #fff;
            border: 1px solid #543d32;
            padding: 8px 24px;
            font-size: 14px;
            font-family: 'DotGothic16', monospace;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
            transition: all 0.1s;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }

        .action-btn:active {
            transform: translateX(-50%) translateY(1px);
        }

        .action-btn.ready-state {
            background: #1e8449;
            border-color: #145a32;
        }

        .action-btn:disabled {
            background: #beafa0;
            border-color: #ab9b88;
            color: #7a6d5e;
            cursor: not-allowed;
            box-shadow: none;
        }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 34, 30, 0.75);
            backdrop-filter: blur(3px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-overlay.orient-p1 .overlay-card {
            transform: rotate(0deg);
        }
        #start-overlay.orient-p2 .overlay-card {
            transform: rotate(180deg);
        }

        .overlay-card {
            background: #f4ebd0;
            border: 3px solid #a67c52;
            padding: 30px 40px;
            border-radius: 8px;
            text-align: center;
            color: #2c221e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }

        .overlay-card h2 {
            margin-top: 0;
            color: #5c3a21;
            font-family: 'DotGothic16', monospace;
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .overlay-sub {
            font-size: 14px;
            color: #8c6747;
            font-weight: bold;
            margin-bottom: 20px;
            height: 20px;
        }

        .big-start-btn {
            background: #704b2b;
            color: #fff;
            border: 2px solid #543d32;
            padding: 12px 32px;
            font-size: 18px;
            font-family: 'DotGothic16', monospace;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.1s;
        }

        .big-start-btn:active {
            transform: translateY(2px);
            background: #5a3a20;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44,34,30,0.6);
            backdrop-filter: blur(2px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #f4ebd0;
            border: 2px solid #a67c52;
            padding: 22px;
            border-radius: 6px;
            max-width: 320px;
            text-align: center;
            color: #2c221e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-content h3 { 
            margin-top: 0; 
            font-family: 'DotGothic16', monospace;
            color: #5c3a21;
            border-bottom: 1px solid #d4c2a5;
            padding-bottom: 8px;
        }
        .modal-content button {
            margin-top: 15px;
            padding: 6px 16px;
            background: #704b2b;
            color: #fff;
            border: 1px solid #543d32;
            font-family: 'DotGothic16', monospace;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

                現れては消える、極上の果実「マンゴー」。マーモットどもが息を潜めて待ち構える中、荒野に姿を現すのは甘い果実か、それとも罠か―― 一瞬の隙も許されない、最速の勝負が始まる。<br><br>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClickSe() {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch(e) {}
        }

        function playStartSound() {
            initAudio();
            try {
                const chordNotes = [293.66, 349.23, 440.00, 587.33];
                chordNotes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    const startTime = audioCtx.currentTime + idx * 0.08;
                    
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.0, startTime);
                    gain.gain.linearRampToValueAtTime(0.12, startTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.45);
                });
            } catch(e) {}
        }

        function playGrabSound() {
            initAudio();
            try {
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }

        function playVictorySound() {
            initAudio();
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + idx * 0.12);
                    osc.stop(audioCtx.currentTime + idx * 0.12 + 0.25);
                });
            } catch(e) {}
        }

        function playDefeatSound() {
            initAudio();
            try {
                const notes = [300, 250, 200];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);

                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.15 + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + idx * 0.15);
                    osc.stop(audioCtx.currentTime + idx * 0.15 + 0.25);
                });
            } catch(e) {}
        }

        function playSadDefeatSound() {
            initAudio();
            try {
                const notes = [293.66, 277.18, 246.94, 220.00];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    const startTime = audioCtx.currentTime + idx * 0.18;
                    
                    osc.frequency.setValueAtTime(freq, startTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.9, startTime + 0.25);

                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.35);
                });
            } catch(e) {}
        }

        let gameState = 'IDLE';
        let p1Ready = false;
        let p2Ready = false;
        let timeoutIds = [];
        let startTime = 0;
        let p1Wins = 0;
        let p2Wins = 0;

        let p1Tapped = false;
        let p2Tapped = false;
        let p1Time = null;
        let p2Time = null;
        let currentVegetableType = '';
        let firstTapTimer = null; // 2 秒以内の待機タイマー

        const p1Status = document.getElementById('p1-status');
        const p2Status = document.getElementById('p2-status');
        const p1Detail = document.getElementById('p1-detail');
        const p2Detail = document.getElementById('p2-detail');
        const p1Btn = document.getElementById('p1-btn');
        const p2Btn = document.getElementById('p2-btn');
        const p1Avatar = document.getElementById('p1-avatar');
        const p2Avatar = document.getElementById('p2-avatar');
        const p1Flash = document.getElementById('p1-flash');
        const p2Flash = document.getElementById('p2-flash');
        const globalCenterStage = document.getElementById('global-center-stage');
        const startOverlay = document.getElementById('start-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySub = document.getElementById('overlay-sub');
        const overlayBtn = document.getElementById('overlay-btn');

        document.querySelectorAll('.player-side').forEach(side => {
            const playerNum = parseInt(side.getAttribute('data-player'));
            side.addEventListener('pointerdown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                handleTap(playerNum);
            });
        });

        document.querySelectorAll('.action-btn').forEach(btn => {
            const playerNum = parseInt(btn.getAttribute('data-player'));
            btn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                handleButton(playerNum);
            });
        });

        function updateScoreIcons() {
            const p1Stars = document.querySelectorAll('#p1-score-icons .star-icon');
            p1Stars.forEach((star, idx) => {
                if (idx < p1Wins) star.classList.add('won');
                else star.classList.remove('won');
            });

            const p2Stars = document.querySelectorAll('#p2-score-icons .star-icon');
            p2Stars.forEach((star, idx) => {
                if (idx < p2Wins) star.classList.add('won');
                else star.classList.remove('won');
            });
        }

        function clearAllTimeouts() {
            timeoutIds.forEach(id => clearTimeout(id));
            timeoutIds = [];
            if (firstTapTimer) {
                clearTimeout(firstTapTimer);
                firstTapTimer = null;
            }
        }

        function triggerFlash(playerNum) {
            const flash = playerNum === 1 ? p1Flash : p2Flash;
            flash.classList.add('flash-active');
            setTimeout(() => {
                flash.classList.remove('flash-active');
            }, 120);
        }

        function triggerHitEffect(opponentNum) {
            const avatar = opponentNum === 1 ? p1Avatar : p2Avatar;
            avatar.classList.add('hit-effect');
            setTimeout(() => {
                avatar.classList.remove('hit-effect');
            }, 350);
        }

        function setCenterObject(type) {
            currentVegetableType = type;
            globalCenterStage.innerHTML = getVegetableSvg(type);
        }

        function clearCenterObject() {
            currentVegetableType = '';
            globalCenterStage.innerHTML = '';
        }

        function openStartOverlay(targetPlayer = 1) {
            clearAllTimeouts();
            gameState = 'IDLE';
            startOverlay.classList.remove('orient-p1', 'orient-p2');
            startOverlay.classList.add(targetPlayer === 2 ? 'orient-p2' : 'orient-p1');
            overlayTitle.textContent = '奪え！マンゴー！';
            overlaySub.textContent = '';
            overlayBtn.textContent = 'ゲームスタート';
            startOverlay.classList.remove('hidden');
        }

        function triggerMainGameStart() {
            playClickSe();
            startOverlay.classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            clearAllTimeouts();
            clearCenterObject();
            gameState = 'IDLE';
            p1Ready = false;
            p2Ready = false;
            p1Wins = 0;
            p2Wins = 0;
            updateScoreIcons();

            p1Avatar.classList.remove('shoot', 'dead', 'hit-effect', 'waiting-anim');
            p2Avatar.classList.remove('shoot', 'dead', 'hit-effect', 'waiting-anim');

            p1Status.textContent = 'ボタンを押して準備';
            p2Status.textContent = 'ボタンを押して準備';
            p1Detail.textContent = '';
            p2Detail.textContent = '';

            p1Btn.disabled = false;
            p2Btn.disabled = false;
            p1Btn.textContent = '開始';
            p2Btn.textContent = '開始';
            p1Btn.classList.remove('ready-state');
            p2Btn.classList.remove('ready-state');
        }

        function handleButton(playerNum) {
            playClickSe();
            if (gameState === 'IDLE' || gameState === 'FINISHED') {
                if (playerNum === 1) {
                    p1Ready = true;
                    p1Btn.textContent = '準備完了';
                    p1Btn.classList.add('ready-state');
                    p1Status.textContent = '相手の準備待ち...';
                } else {
                    p2Ready = true;
                    p2Btn.textContent = '準備完了';
                    p2Btn.classList.add('ready-state');
                    p2Status.textContent = '相手の準備待ち...';
                }

                if (p1Ready && p2Ready) {
                    startDuelSequence();
                }
            }
        }

        function startDuelSequence() {
            gameState = 'WAITING';
            p1Ready = false;
            p2Ready = false;
            p1Tapped = false;
            p2Tapped = false;
            p1Time = null;
            p2Time = null;
            clearCenterObject();

            p1Avatar.classList.remove('shoot', 'dead', 'hit-effect');
            p2Avatar.classList.remove('shoot', 'dead', 'hit-effect');

            p1Avatar.classList.add('waiting-anim');
            p2Avatar.classList.add('waiting-anim');

            p1Btn.disabled = true;
            p2Btn.disabled = true;
            p1Btn.classList.remove('ready-state');
            p2Btn.classList.remove('ready-state');

            p1Status.textContent = '';
            p2Status.textContent = '';
            p1Detail.textContent = '';
            p2Detail.textContent = '';

            clearAllTimeouts();
            playStartSound();

            const totalWins = p1Wins + p2Wins;
            let maxFeints = Math.max(1, 4 - Math.floor(totalWins * 0.5));
            let feintCount = Math.floor(Math.random() * (maxFeints + 1));

            runFeintLoop(feintCount);
        }

        function runFeintLoop(remainingFeints) {
            if (gameState !== 'WAITING') return;

            const nextDelay = Math.random() * 500 + 700;

            timeoutIds.push(setTimeout(() => {
                if (gameState !== 'WAITING') return;

                if (remainingFeints > 0) {
                    const feintTypes = ['apple', 'tamanegi'];
                    const selectedFeintVeg = feintTypes[Math.floor(Math.random() * feintTypes.length)];

                    setCenterObject(selectedFeintVeg);

                    const hideTime = Math.random() * 800 + 1200;
                    timeoutIds.push(setTimeout(() => {
                        if (gameState !== 'WAITING') return;
                        
                        clearCenterObject();

                        const pauseTime = Math.random() * 500 + 600;
                        timeoutIds.push(setTimeout(() => {
                            if (gameState !== 'WAITING') return;
                            runFeintLoop(remainingFeints - 1);
                        }, pauseTime));

                    }, hideTime));

                } else {
                    // マンゴー出現前の間を他のフェイント野菜と同じペースに統一
                    const realTime = Math.random() * 500 + 700;
                    timeoutIds.push(setTimeout(() => {
                        triggerMango();
                    }, realTime));
                }

            }, nextDelay));
        }

        function triggerMango() {
            if (gameState !== 'WAITING') return;
            gameState = 'READY';
            setCenterObject('mango');
            startTime = performance.now();
        }

        function handleTap(playerNum) {
            if (gameState === 'WAITING') {
                const veg = currentVegetableType;
                const isInstantDeath = (veg === 'tamanegi');

                p1Avatar.classList.remove('waiting-anim');
                p2Avatar.classList.remove('waiting-anim');

                if (isInstantDeath) {
                    clearAllTimeouts();
                    gameState = 'FINISHED';
                    playSadDefeatSound();
                    playGrabSound();
                    triggerFlash(playerNum);
                    const opponentNum = playerNum === 1 ? 2 : 1;
                    triggerHitEffect(opponentNum);

                    const deathMessages = {
                        'tamanegi': '💀タマネギを食べてしまった…'
                    };

                    if (playerNum === 1) {
                        p1Tapped = true;
                        p1Avatar.classList.add('dead');
                        p2Avatar.classList.add('shoot');
                        p1Status.textContent = '';
                        p2Status.textContent = '';
                        p1Detail.textContent = 'うぐっ…';
                        p2Detail.textContent = 'なんてこったい';
                        
                        triggerGameOver(2, deathMessages[veg], 1, playerNum);
                    } else {
                        p2Tapped = true;
                        p2Avatar.classList.add('dead');
                        p1Avatar.classList.add('shoot');
                        p2Status.textContent = '';
                        p1Status.textContent = '';
                        p2Detail.textContent = 'うぐっ…';
                        p1Detail.textContent = 'なんこったい';
                        
                        triggerGameOver(1, deathMessages[veg], 2, playerNum);
                    }
                    return;
                } else {
                    clearAllTimeouts();
                    gameState = 'FINISHED';
                    playDefeatSound();
                    playGrabSound();
                    triggerFlash(playerNum);
                    const opponentNum = playerNum === 1 ? 2 : 1;
                    triggerHitEffect(opponentNum);

                    if (playerNum === 1) {
                        p1Tapped = true;
                        p1Avatar.classList.add('dead');
                        p2Avatar.classList.add('shoot');
                        p1Status.textContent = '';
                        p2Status.textContent = '';
                        p1Detail.textContent = 'ミス（🥭-1）';
                        p2Detail.textContent = 'セーフ';
                        p1Wins = Math.max(0, p1Wins - 1);
                    } else {
                        p2Tapped = true;
                        p2Avatar.classList.add('dead');
                        p1Avatar.classList.add('shoot');
                        p2Status.textContent = '';
                        p1Status.textContent = '';
                        p2Detail.textContent = 'ミス（🥭-1）';
                        p1Detail.textContent = 'セーフ';
                        p2Wins = Math.max(0, p2Wins - 1);
                    }
                    updateScoreIcons();
                    checkMatchEnd();
                    return;
                }

            } else if (gameState === 'READY') {
                p1Avatar.classList.remove('waiting-anim');
                p2Avatar.classList.remove('waiting-anim');

                const tapDuration = (performance.now() - startTime) / 1000;
                playGrabSound();
                triggerFlash(playerNum);

                const opponentNum = playerNum === 1 ? 2 : 1;
                triggerHitEffect(opponentNum);

                if (playerNum === 1 && !p1Tapped) {
                    p1Tapped = true;
                    p1Time = tapDuration;
                    p1Avatar.classList.add('shoot');
                    p1Detail.textContent = `タイム: ${p1Time.toFixed(3)} 秒`;
                    p1Status.textContent = '';
                } else if (playerNum === 2 && !p2Tapped) {
                    p2Tapped = true;
                    p2Time = tapDuration;
                    p2Avatar.classList.add('shoot');
                    p2Detail.textContent = `タイム: ${p2Time.toFixed(3)} 秒`;
                    p2Status.textContent = '';
                }

                // 最初のプレイヤーがタップした瞬間の処理
                if ((p1Tapped && !p2Tapped) || (!p1Tapped && p2Tapped)) {
                    if (!firstTapTimer) {
                        const firstPlayer = p1Tapped ? 1 : 2;
                        // 2 秒間もう片方がタップしなければ、その時点でラウンド決着
                        firstTapTimer = setTimeout(() => {
                            if (gameState === 'READY') {
                                finalizeRoundByTimeout(firstPlayer);
                            }
                        }, 2000);
                    }
                }

                if (p1Tapped && p2Tapped) {
                    if (firstTapTimer) {
                        clearTimeout(firstTapTimer);
                        firstTapTimer = null;
                    }
                    const delayWeight = 600; 
                    setTimeout(finalizeRound, delayWeight);
                }
            }
        }

        // 片方が2 秒以内にタップしなかった場合の終了処理
        function finalizeRoundByTimeout(firstPlayer) {
            if (gameState === 'FINISHED') return;
            gameState = 'FINISHED';

            p1Avatar.classList.remove('waiting-anim');
            p2Avatar.classList.remove('waiting-anim');

            if (firstPlayer === 1) {
                p2Tapped = true;
                p2Avatar.classList.add('dead');
                p1Wins++;
                p1Detail.textContent = `タイム: ${p1Time.toFixed(3)} 秒 (🥭+1)`;
                p2Detail.textContent = '残念!';
            } else {
                p1Tapped = true;
                p1Avatar.classList.add('dead');
                p2Wins++;
                p2Detail.textContent = `タイム: ${p2Time.toFixed(3)} 秒 (🥭+1)`;
                p1Detail.textContent = '残念!';
            }

            updateScoreIcons();
            playVictorySound();
            checkMatchEnd();
        }

        function finalizeRound() {
            if (gameState === 'FINISHED') return;
            gameState = 'FINISHED';

            if (firstTapTimer) {
                clearTimeout(firstTapTimer);
                firstTapTimer = null;
            }

            p1Avatar.classList.remove('waiting-anim');
            p2Avatar.classList.remove('waiting-anim');

            if (p1Time < p2Time) {
                p1Status.textContent = '';
                p2Status.textContent = '';
                p2Avatar.classList.add('dead');
                p1Wins++;
                p1Detail.textContent = `タイム: ${p1Time.toFixed(3)} 秒 (🥭+1)`;
                p2Detail.textContent = `タイム: ${p2Time.toFixed(3)} 秒`;
                updateScoreIcons();
                playVictorySound();
            } else if (p2Time < p1Time) {
                p2Status.textContent = '';
                p1Status.textContent = '';
                p1Avatar.classList.add('dead');
                p2Wins++;
                p2Detail.textContent = `タイム: ${p2Time.toFixed(3)} 秒 (🥭+1)`;
                p1Detail.textContent = `タイム: ${p1Time.toFixed(3)} 秒`;
                updateScoreIcons();
                playVictorySound();
            } else {
                p1Status.textContent = '';
                p2Status.textContent = '';
                p1Detail.textContent = `タイム: ${p1Time.toFixed(3)} 秒`;
                p2Detail.textContent = `タイム: ${p2Time.toFixed(3)} 秒`;
            }

            checkMatchEnd();
        }

        function triggerGameOver(winnerNum, messageText, loserNum, orientPlayer = null) {
            gameState = 'MATCH_OVER';
            p1Avatar.classList.remove('waiting-anim');
            p2Avatar.classList.remove('waiting-anim');

            p1Status.textContent = '';
            p2Status.textContent = '';
            playSadDefeatSound();
            
            const targetOrient = orientPlayer !== null ? orientPlayer : winnerNum;
            startOverlay.classList.remove('orient-p1', 'orient-p2');
            startOverlay.classList.add(targetOrient === 2 ? 'orient-p2' : 'orient-p1');

            overlayTitle.textContent = messageText;
            if (loserNum) {
                overlaySub.textContent = `マーモット${loserNum}の敗北`;
            } else {
                overlaySub.textContent = '';
            }
            overlayBtn.textContent = 'もう一度プレイ';
            
            setTimeout(() => {
                startOverlay.classList.remove('hidden');
            }, 2000);
        }

        function checkMatchEnd() {
            if (p1Wins >= 3 || p2Wins >= 3) {
                gameState = 'MATCH_OVER';
                p1Avatar.classList.remove('waiting-anim');
                p2Avatar.classList.remove('waiting-anim');

                p1Status.textContent = 'ネクスト';
                p2Status.textContent = '';
                playVictorySound();
                
                const winnerNum = p1Wins > p2Wins ? 1 : 2;
                
                startOverlay.classList.remove('orient-p1', 'orient-p2');
                startOverlay.classList.add(winnerNum === 2 ? 'orient-p2' : 'orient-p1');

                overlayTitle.textContent = p1Wins > p2Wins ? 'マーモット1の勝利！' : 'マーモット2の勝利！';
                overlaySub.textContent = '';
                overlayBtn.textContent = 'もう一度プレイ';
                
                setTimeout(() => {
                    startOverlay.classList.remove('hidden');
                }, 2000);
            } else {
                p1Ready = false;
                p2Ready = false;
                p1Btn.disabled = false;
                p2Btn.disabled = false;
                p1Btn.textContent = '次へ';
                p2Btn.textContent = '次へ';
                p1Btn.classList.remove('ready-state');
                p2Btn.classList.remove('ready-state');
            }
        }

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }
    </script>
</body>
</html>
